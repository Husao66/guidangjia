<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1ECE2">
<title>归档夹 · 私人文件档案</title>
<meta name="description" content="把散落的证件、合同、票据收进一个找得到的地方。本地存储，不上传服务器。">
<meta property="og:title" content="归档夹 · 私人文件档案">
<meta property="og:description" content="把证件、合同、票据收进一个找得到的地方。文件只在本机浏览器，不上传服务器。">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2328564B'/%3E%3Cpath d='M14 22h15l5 5h16v20a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3V22z' fill='%23F1ECE2'/%3E%3Cpath d='M14 27h36v3H14z' fill='%23C39B58'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap">
<style>
/* ===== 基础与配色 ===== */
:root{
  --bg:#F1ECE2;
  --paper:#FBF9F4;
  --paper-2:#F6F2E9;
  --ink:#1E2823;
  --ink-2:#354138;
  --muted:#7B8178;
  --line:#DCD4C4;
  --line-soft:#E8E2D6;
  --pine:#28564B;
  --pine-dark:#1B3E36;
  --pine-soft:#E4EDE8;
  --rust:#B4613B;
  --rust-soft:#F5E6DE;
  --gold:#C39B58;
  --gold-soft:#F3EAD8;
  --danger:#A94438;
  --shadow:0 16px 40px rgba(52,45,35,.08);
  --shadow-sm:0 6px 18px rgba(52,45,35,.06);
  --radius:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.6;
  background-color:var(--bg);
  background-image:
    radial-gradient(1200px 620px at 8% -12%, rgba(195,155,88,.14), transparent 62%),
    radial-gradient(900px 520px at 100% 0%, rgba(40,86,75,.09), transparent 60%),
    repeating-linear-gradient(0deg, rgba(30,40,35,.018) 0 1px, transparent 1px 4px);
  background-attachment:fixed;
}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
::selection{background:rgba(40,86,75,.18)}
h1,h2,h3,h4{margin:0;font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-weight:600;letter-spacing:.01em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.serif{font-family:"Noto Serif SC","Songti SC",serif}
.hide{display:none!important}
.ellipsis{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.wrap{flex-wrap:wrap}

/* ===== 图标 ===== */
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:20px;height:20px;display:block}
.ico.sm svg{width:16px;height:16px}
.ico.lg svg{width:28px;height:28px}
.ico.xl svg{width:38px;height:38px}

/* ===== 键盘焦点 ===== */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.folder:focus-visible,.doc-row:focus-visible{outline:2px solid var(--pine);outline-offset:3px}

/* ===== 顶栏 ===== */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(241,236,226,.86);
  backdrop-filter:blur(18px) saturate(120%);
  -webkit-backdrop-filter:blur(18px) saturate(120%);
  border-bottom:1px solid rgba(220,212,196,.9);
}
.topbar-inner{max-width:1220px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:11px;flex:none;cursor:pointer}
.brand-mark{
  width:42px;height:42px;border-radius:11px;background:var(--pine-dark);color:#F6F1E6;
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif SC",serif;font-size:22px;font-weight:600;
  box-shadow:0 6px 16px rgba(27,62,54,.24);position:relative;overflow:hidden;
}
.brand-mark::after{content:"";position:absolute;inset:5px;border:1px solid rgba(246,241,230,.26);border-radius:7px}
.brand-text h1{font-size:20px;line-height:1.2;letter-spacing:.08em}
.brand-text span{display:block;font-size:9px;letter-spacing:.24em;color:var(--muted);margin-top:2px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:2px;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(251,249,244,.72);flex:none}
.nav a{padding:8px 14px;border-radius:999px;font-size:12.5px;color:var(--muted);white-space:nowrap;transition:.18s}
.nav a:hover{color:var(--ink)}
.nav a.active{background:var(--ink);color:#FBF9F4}
.header-search{display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:rgba(251,249,244,.9);flex:1;max-width:360px;min-width:180px;transition:.18s}
.header-search:focus-within{border-color:var(--pine);box-shadow:0 0 0 3px rgba(40,86,75,.12)}
.header-search .ico{color:var(--muted)}
.header-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px;height:100%}
.header-search input::placeholder{color:#A6A99F}
.kbd{border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:10px;color:var(--muted);background:#fff}
.header-actions{display:flex;align-items:center;gap:8px;flex:none}
.btn-compact{display:none}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:40px;padding:0 16px;border-radius:11px;border:1px solid transparent;
  font-size:13px;font-weight:600;white-space:nowrap;transition:.18s;
  background:transparent;color:var(--ink);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--pine-dark);color:#FBF7EC;box-shadow:0 6px 16px rgba(27,62,54,.18)}
.btn-primary:hover{background:#16332C}
.btn-ghost{border-color:var(--line);background:rgba(251,249,244,.7);color:var(--ink-2)}
.btn-ghost:hover{border-color:#C9BFAE;background:#fff}
.btn-soft{background:var(--pine-soft);color:var(--pine-dark)}
.btn-soft:hover{background:#D8E7DF}
.btn-danger{background:var(--rust-soft);color:var(--danger)}
.btn-danger:hover{background:#F0D8CC}
.btn-plain{color:var(--muted);padding:0 8px}
.btn-plain:hover{color:var(--ink)}
.btn.sm{height:32px;padding:0 11px;font-size:12px;border-radius:8px}
.btn.lg{height:46px;padding:0 22px;font-size:14px}
.btn.block{width:100%}
.icon-btn{width:38px;height:38px;padding:0;border-radius:10px;border:1px solid var(--line);background:rgba(251,249,244,.8);display:inline-flex;align-items:center;justify-content:center;transition:.18s}
.icon-btn:hover{border-color:#C9BFAE;background:#fff}
.icon-btn.danger:hover{border-color:#E3BEB4;background:var(--rust-soft);color:var(--danger)}

/* ===== 页面容器 ===== */
.page{max-width:1220px;margin:0 auto;padding:0 26px 70px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:38px 0 20px}
.page-head h2{font-size:32px;line-height:1.15}
.page-head .sub{color:var(--muted);font-size:12.5px;margin-top:6px}
.breadcrumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-top:30px}
.breadcrumb a:hover{color:var(--ink)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:34px 0 14px}
.section-head h3{font-size:20px}
.section-head .sub{font-size:12px;color:var(--muted);margin-top:3px}
.link-btn{font-size:12px;color:var(--pine);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.link-btn:hover{text-decoration:underline}

/* ===== 首页 Hero ===== */
.hero{display:grid;grid-template-columns:1.35fr .8fr;gap:24px;padding:42px 0 8px;align-items:stretch}
.hero-copy{padding:16px 0}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.2em;color:var(--pine);text-transform:uppercase;margin-bottom:18px}
.kicker::before{content:"";width:28px;height:1px;background:var(--pine)}
.hero h2{font-size:46px;line-height:1.19;letter-spacing:.01em}
.hero h2 em{font-style:normal;color:var(--pine);position:relative;white-space:nowrap}
.hero h2 em::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:7px;background:rgba(195,155,88,.28);z-index:-1;border-radius:2px}
.hero-desc{max-width:520px;color:var(--ink-2);font-size:14px;line-height:1.9;margin-top:18px}
.hero-actions{display:flex;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.hero-note{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;margin-top:16px}
.hero-note .dot{width:7px;height:7px;border-radius:50%;background:#5E8C6A;box-shadow:0 0 0 3px rgba(94,140,106,.14)}
.ledger{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:8px 0;position:relative;overflow:hidden;
}
.ledger::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--pine),var(--gold))}
.ledger-head{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 10px}
.ledger-head span{font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.ledger-head b{font-family:"Noto Serif SC",serif;font-size:12px;color:var(--pine);font-weight:500}
.ledger-row{display:flex;align-items:baseline;justify-content:space-between;padding:14px 22px;border-top:1px dashed var(--line-soft)}
.ledger-row .num{font-family:"Noto Serif SC",serif;font-size:34px;line-height:1.05;font-weight:600;letter-spacing:.02em}
.ledger-row .label{font-size:11.5px;color:var(--muted);text-align:right}
.ledger-row .label b{display:block;color:var(--ink-2);font-weight:500;font-size:12px;margin-bottom:2px}
.ledger-foot{padding:12px 22px 16px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.mini-bar{height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden;flex:1;margin:0 10px}
.mini-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pine),#6C9786);border-radius:3px}

/* ===== 分类 ===== */
.cat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.folder{
  position:relative;background:var(--paper);border:1px solid var(--line);border-radius:13px;
  padding:20px 18px 16px;cursor:pointer;transition:.2s;overflow:hidden;
  min-height:112px;display:flex;flex-direction:column;justify-content:space-between;
}
.folder::before{
  content:"";position:absolute;left:14px;top:-1px;width:62px;height:9px;
  background:var(--paper);border:1px solid var(--line);border-bottom:0;
  border-radius:7px 7px 0 0;
}
.folder:hover{transform:translateY(-3px);box-shadow:var(--shadow-sm);border-color:#CFC5B3}
.folder-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.folder-icon{width:40px;height:40px;border-radius:10px;background:var(--pine-soft);color:var(--pine);display:flex;align-items:center;justify-content:center}
.folder-icon.gold{background:var(--gold-soft);color:#8A6A2E}
.folder-icon.rust{background:var(--rust-soft);color:var(--rust)}
.folder-index{font-family:"Noto Serif SC",serif;font-size:11px;color:#B9B2A4;letter-spacing:.12em}
.folder-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px}
.folder-name{font-family:"Noto Serif SC",serif;font-size:17px;font-weight:600}
.folder-count{font-size:11px;color:var(--muted);margin-top:2px}
.folder-arrow{color:#B9B2A4;font-size:18px;transition:.2s}
.folder:hover .folder-arrow{color:var(--pine);transform:translateX(3px)}

/* ===== 文件行 ===== */
.doc-row{
  display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;align-items:center;
  padding:13px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:.16s;background:transparent;
}
.doc-row:last-child{border-bottom:0}
.doc-row:hover{background:rgba(255,255,255,.62)}
.doc-row.selected{background:var(--pine-soft)}
.doc-row.selectable{grid-template-columns:18px 46px minmax(0,1fr) auto}
.thumb{
  width:46px;height:46px;border-radius:10px;background:#EDE8DC;border:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:center;color:var(--pine);overflow:hidden;flex:none;
}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:21px;height:21px}
.doc-name{font-size:14px;font-weight:500;line-height:1.45;color:var(--ink)}
.doc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:11px;color:var(--muted)}
.doc-meta .sep{width:1px;height:9px;background:var(--line)}
.doc-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.doc-amount{font-family:"Noto Serif SC",serif;font-size:13px;color:var(--ink-2)}
.status{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap;letter-spacing:.02em}
.status::before{content:"";width:5px;height:5px;border-radius:50%}
.status.ready{background:#E7F0E9;color:#2F6B4A}.status.ready::before{background:#4E8E63}
.status.need_review{background:var(--gold-soft);color:#8A6224}.status.need_review::before{background:#C39B58}
.status.failed{background:var(--rust-soft);color:var(--danger)}.status.failed::before{background:#B4613B}
.status.processing{background:#EDEAE2;color:#777}.status.processing::before{background:#999}
.tag{display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:5px;font-size:10px;font-weight:500;background:#F0ECE2;color:#6C7068;border:1px solid #E5DED0}
.tag-dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin-right:4px}

/* ===== 工具条 / 筛选 ===== */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.filter-pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:rgba(251,249,244,.8);color:var(--ink-2);font-size:11.5px;cursor:pointer;transition:.16s}
.filter-pill:hover{border-color:#C9BFAE;background:#fff}
.filter-pill.on{background:var(--ink);border-color:var(--ink);color:#FBF9F4}
.filter-pill .x{opacity:.6;font-size:13px;line-height:1}
.spacer{flex:1}
.select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:0 9px;font-size:11.5px;outline:0}
.list-count{font-size:11.5px;color:var(--muted);white-space:nowrap}
.list-wrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
.select-dot{width:17px;height:17px;border-radius:50%;border:1.5px solid #C9C2B4;background:transparent;position:relative;flex:none;cursor:pointer}
.select-dot.on{background:var(--pine);border-color:var(--pine)}
.select-dot.on::after{content:"";position:absolute;left:5px;top:2.5px;width:4px;height:7px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.batch-bar{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(251,249,244,.94);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(30,40,35,.2);backdrop-filter:blur(14px);
}
.batch-bar .count{font-size:12px;color:var(--ink-2);font-weight:600;margin-right:4px;white-space:nowrap}

/* ===== 详情 ===== */
.detail-grid{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(330px,.68fr);gap:20px;align-items:start}
.preview-panel{
  background:#E7E1D4;border:1px solid var(--line);border-radius:var(--radius);min-height:430px;
  display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;overflow:hidden;position:relative;
}
.preview-panel.dark{background:#222824}
.preview-stage{width:100%;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1}
.preview-image{max-width:100%;max-height:72vh;object-fit:contain;position:relative;z-index:1}
.preview-frame{width:100%;height:72vh;border:0;background:#fff;position:relative;z-index:1}
.preview-text{width:100%;max-height:72vh;overflow:auto;margin:0;padding:24px;background:#FCFAF5;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.8;color:var(--ink-2);position:relative;z-index:1}
.preview-richtext{width:100%;max-height:72vh;overflow:auto;background:#fff;padding:28px 30px;font-size:13px;line-height:1.85;color:#242B27;position:relative;z-index:1}
.preview-richtext p{margin:0 0 10px}
.preview-richtext h1,.preview-richtext h2,.preview-richtext h3,.preview-richtext h4,.preview-richtext h5,.preview-richtext h6{font-family:"Noto Serif SC",serif;color:var(--ink);margin:16px 0 8px;line-height:1.45}
.preview-richtext h1{font-size:20px}.preview-richtext h2{font-size:17px}.preview-richtext h3{font-size:15px}
.preview-richtext ul,.preview-richtext ol{margin:0 0 10px;padding-left:22px}
.preview-richtext table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-size:12px}
.preview-richtext th,.preview-richtext td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.preview-richtext th{background:var(--paper-2);font-weight:600}
.preview-table-wrap{width:100%;max-height:72vh;overflow:auto;background:#fff;position:relative;z-index:1}
.preview-table{width:max-content;min-width:100%;border-collapse:collapse;font-size:11.5px;line-height:1.5}
.preview-table th,.preview-table td{border:1px solid var(--line-soft);padding:5px 8px;text-align:left;vertical-align:top;max-width:210px;white-space:normal;word-break:break-word}
.preview-table th{background:var(--paper-2);font-weight:600;position:sticky;top:0;z-index:2}
.preview-table .row-no{background:#FAF8F2;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.preview-note{padding:9px 14px;border-top:1px solid var(--line-soft);background:#FAF8F2;color:var(--muted);font-size:10.5px}
.preview-placeholder{padding:48px 20px;text-align:center;color:#7B8178}
.preview-placeholder .big-icon{width:78px;height:78px;border-radius:16px;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--pine)}
.preview-placeholder .t{font-family:"Noto Serif SC",serif;font-size:18px;color:var(--ink);margin-bottom:6px}
.watermark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-20deg);z-index:2;pointer-events:none;border:1px solid rgba(40,86,75,.5);color:rgba(40,86,75,.62);padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.08)}
.watermark-grid{position:absolute;inset:0;z-index:2;opacity:.14;pointer-events:none;background-image:repeating-linear-gradient(-20deg,transparent 0 90px,rgba(40,86,75,.16) 90px 91px)}
.preview-caption{align-self:flex-start;margin:8px 14px 12px;z-index:3;padding:4px 8px;border-radius:5px;background:rgba(30,40,35,.55);color:rgba(255,255,255,.85);font-size:10px;letter-spacing:.06em}
.meta-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.meta-card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.meta-line{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.meta-line:last-child{border-bottom:0;padding-bottom:0}
.meta-line .k{color:var(--muted);flex:none;min-width:72px}
.meta-line .v{text-align:right;color:var(--ink-2);min-width:0;word-break:break-word}
.meta-line .v.link{color:var(--pine);cursor:pointer;font-weight:600}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;letter-spacing:.03em}
.field input,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;background:#FCFAF5;
  padding:9px 10px;outline:0;font-size:12.5px;transition:.16s;
}
.field input:focus,.field textarea:focus{border-color:var(--pine);box-shadow:0 0 0 3px rgba(40,86,75,.1);background:#fff}
.field textarea{resize:vertical;min-height:62px;line-height:1.7}
.audit-item{display:flex;gap:10px;padding:7px 0;font-size:11.5px;color:var(--ink-2)}
.audit-item .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:7px;flex:none}
.audit-item .time{margin-left:auto;color:var(--muted);font-size:10.5px;white-space:nowrap}
.empty{background:var(--paper);border:1px dashed #D2C8B8;border-radius:var(--radius);padding:64px 24px;text-align:center}
.empty .art{width:94px;height:74px;margin:0 auto 18px;position:relative}
.empty .art .back{position:absolute;left:10px;right:10px;bottom:0;height:50px;border:1px solid #D4C9B7;border-radius:8px;background:#EFE8DA}
.empty .art .front{position:absolute;left:0;right:0;bottom:8px;height:50px;border:1px solid #CFC4B1;border-radius:8px;background:var(--paper);box-shadow:0 5px 14px rgba(52,45,35,.06)}
.empty .art .tab{position:absolute;left:12px;bottom:56px;width:40px;height:12px;background:var(--paper);border:1px solid #CFC4B1;border-bottom:0;border-radius:6px 6px 0 0}
.empty .t{font-family:"Noto Serif SC",serif;font-size:19px;margin-bottom:6px}
.empty .s{color:var(--muted);font-size:12px;max-width:420px;margin:0 auto 18px;line-height:1.8}

/* ===== 待确认 / 回收站 ===== */
.review-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.review-top{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.suggest{background:var(--gold-soft);border-radius:9px;padding:10px 12px;margin:12px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.suggest .path{font-size:12px;font-weight:600;color:#7D5B20}
.suggest .conf{font-size:10px;color:#A07C3D;border:1px solid #DFC895;border-radius:4px;padding:1px 5px}
.suggest .reason{font-size:11px;color:#8A744D;flex:1;min-width:150px}
.review-actions{display:flex;gap:8px;flex-wrap:wrap}
.section-note{background:rgba(195,155,88,.12);border:1px solid #E4D4B2;border-radius:11px;padding:14px 16px;font-size:12px;color:#6F5A32;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.section-note .ico{color:#A77B2F;margin-top:2px}

/* ===== 设置 ===== */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.set-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm)}
.set-card h3 .btn{float:right;margin-top:-4px}
.set-card h3{font-size:17px;margin-bottom:4px}
.set-card .desc{font-size:11.5px;color:var(--muted);margin-bottom:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.set-row:last-child{border-bottom:0}
.set-row .r-desc{font-size:10.5px;color:var(--muted);margin-top:2px}
.set-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cat-node{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.cat-node:last-child{border-bottom:0}
.cat-node-head{display:flex;align-items:center;gap:8px}
.cat-node-head .n{font-size:13px;font-weight:600}
.cat-node-head .c{font-size:10px;color:var(--muted)}
.cat-node-head .ops{margin-left:auto;display:flex;gap:10px;opacity:.72;flex-wrap:wrap;justify-content:flex-end}.cat-node-head .ops button{border:0;background:none;color:var(--pine);font-size:10.5px;padding:2px;cursor:pointer}
.cat-node-head .ops button.danger{color:var(--danger)}
.cat-node-head .ops button:disabled{opacity:.3;cursor:default}
.cat-children{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px 22px}
.cat-child{display:inline-flex;align-items:center;gap:6px;background:#F0ECE2;border:1px solid #E5DED0;border-radius:6px;padding:4px 7px;font-size:10.5px;color:#5E655C}
.cat-child button{border:0;background:none;color:#9B9486;font-size:10px;padding:0;cursor:pointer}
.cat-child button:hover{color:var(--danger)}
.threshold-row{display:flex;align-items:center;gap:14px;margin:8px 0 4px}
.threshold-row input[type=range]{flex:1;accent-color:var(--pine)}
.threshold-val{font-family:"Noto Serif SC",serif;font-size:18px;color:var(--pine);min-width:46px;text-align:right}
.tag-manage-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.tag-manage-row:last-child{border-bottom:0}
.tag-color{width:9px;height:9px;border-radius:50%;flex:none}
.tag-manage-row .count{margin-left:auto;color:var(--muted);font-size:10.5px}
.tag-manage-row button{border:0;background:none;color:var(--pine);font-size:10.5px;cursor:pointer}
.storage-bar{height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden;margin:12px 0 6px}
.storage-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pine),#7FA08F);border-radius:4px}
.how-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* ===== 弹层 ===== */
.modal-backdrop{position:fixed;inset:0;z-index:60;background:rgba(25,30,27,.44);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(560px,100%);max-height:90vh;background:var(--paper);border:1px solid #D5CBB9;border-radius:18px;box-shadow:0 30px 90px rgba(20,28,24,.3);display:flex;flex-direction:column;overflow:hidden;animation:pop .2s ease}
.modal.wide{width:min(680px,100%)}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:.8}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:20px 22px 14px;border-bottom:1px solid var(--line-soft)}
.modal-head h3{font-size:20px}
.modal-head .sub{font-size:11px;color:var(--muted);margin-top:3px}
.modal-body{padding:18px 22px;overflow:auto}
.modal-foot{padding:14px 22px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line-soft);display:flex;gap:10px;justify-content:flex-end;background:rgba(251,249,244,.8)}
.drop-zone{border:1.5px dashed #CBBFA9;border-radius:12px;background:#F7F3E9;padding:26px 18px;text-align:center;cursor:pointer;transition:.18s}
.drop-zone:hover,.drop-zone.over{border-color:var(--pine);background:var(--pine-soft)}
.drop-zone .big{width:52px;height:52px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:var(--pine)}
.drop-zone .t{font-size:14px;font-weight:600}
.drop-zone .s{font-size:11px;color:var(--muted);margin-top:3px}
.queue{margin-top:14px;display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
.queue-item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line-soft);border-radius:9px;padding:8px 10px}
.queue-item .q-icon{width:32px;height:32px;border-radius:7px;background:#F1EDE3;display:flex;align-items:center;justify-content:center;color:var(--pine)}
.queue-item .q-name{font-size:11.5px;font-weight:500;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queue-item .q-meta{font-size:10px;color:var(--muted);margin-top:1px}
.queue-item .q-status{font-size:10px;white-space:nowrap}
.queue-item .q-status.ok{color:#2F6B4A}
.queue-item .q-status.err{color:var(--danger)}
.queue-item .q-status.dup{color:#8A6224}
.cat-modal-grid{display:grid;grid-template-columns:150px 1fr;gap:14px;min-height:250px}
.cat-l1{display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line-soft);padding-right:10px;max-height:340px;overflow:auto}
.cat-l1 button{display:flex;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:9px 8px;border-radius:7px;font-size:12px;color:var(--ink-2);cursor:pointer}
.cat-l1 button.on{background:var(--pine-soft);color:var(--pine-dark);font-weight:600}
.cat-l2{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;max-height:340px;overflow:auto}
.cat-l2 button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 11px;font-size:12px;cursor:pointer;transition:.15s}
.cat-l2 button:hover{border-color:var(--pine);color:var(--pine)}
.cat-l2 button.on{background:var(--pine-dark);color:#fff;border-color:var(--pine-dark)}
.tag-picker{display:flex;flex-wrap:wrap;gap:8px}
.tag-picker button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:11.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tag-picker button.on{background:var(--pine-dark);color:#fff;border-color:var(--pine-dark)}
.confirm-body{font-size:13px;line-height:1.8;color:var(--ink-2)}
.confirm-body strong{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,12px);z-index:80;background:rgba(27,62,54,.96);color:#FBF7EC;border-radius:10px;padding:10px 16px;font-size:12.5px;box-shadow:0 12px 36px rgba(20,28,24,.25);opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:rgba(169,68,56,.97)}

/* ===== 导航小屏 ===== */
.mobile-nav{display:none}
@media (max-width:1080px){
  .topbar-inner{gap:14px;padding:12px 18px}

}

    padding:6px 10px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;
  }
  .mobile-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);padding:5px 12px;border-radius:8px;min-width:54px}

  body{padding-bottom:0}
  .batch-bar{bottom:78px}
}
@media (max-width:620px){
  .topbar-inner{padding:10px 14px;gap:10px}
  .brand-text h1{font-size:18px}
  .brand-text span{font-size:8px}
  .brand-mark{width:38px;height:38px;font-size:20px}
  .header-actions .btn > span:not(.ico):not(.btn-compact){display:none}
  .header-actions .btn .btn-compact{display:inline}
  .header-actions .btn{padding:0 10px}
  .brand{order:1}
  .header-actions{order:2;margin-left:auto}
  .header-search{order:3;flex:0 0 100%;height:38px}

  .header-search{height:38px}
  .page{padding:0 14px 62px}
  .hero{padding-top:24px}
  .hero h2{font-size:31px}
  .hero-desc{font-size:12.5px;line-height:1.8}
  .page-head{flex-direction:column;align-items:stretch;gap:10px}
  .page-head .row{flex-wrap:wrap}
  .ledger-row .num{font-size:28px}
  .cat-grid{gap:9px}
  .folder{padding:15px 12px 12px;min-height:96px}
  .folder-icon{width:32px;height:32px}
  .folder-name{font-size:14px}
  .folder-count{font-size:10px}
  .section-head{margin-top:24px}

  .doc-row{grid-template-columns:38px minmax(0,1fr) auto;gap:10px;padding:11px 12px}

  .how-grid{grid-template-columns:1fr}
  .thumb{width:38px;height:38px}
  .doc-name{font-size:12.5px}
  .doc-meta{font-size:10px;gap:5px}
  .doc-right .status{height:19px;font-size:9px;padding:0 6px}

  .cat-modal-grid{grid-template-columns:1fr;min-height:0}
  .cat-l1{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line-soft);padding:0 0 8px;max-height:130px}
  .cat-l1 button{padding:6px 8px}
  .cat-l2{max-height:200px}
  .detail-grid{gap:14px}
  .preview-panel{min-height:240px}
  .preview-stage{min-height:240px}
  .preview-frame{height:58vh}
  .preview-richtext,.preview-table-wrap{max-height:58vh}
  .preview-richtext{padding:20px 18px}
  .review-top{grid-template-columns:38px 1fr;gap:9px}
  .review-top .side{grid-column:1/-1;display:flex;justify-content:flex-end}
  .settings-grid{gap:12px}
  .set-card{padding:16px}
  .batch-bar{left:10px;right:10px;transform:none;bottom:76px;justify-content:space-between;padding:9px 10px}
  .batch-bar .btn{padding:0 9px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

function esc(v){

function uid(prefix='doc'){
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}
function fmtSize(n){
  n = Number(n) || 0;
  if(n < 1024) return n + ' B';
  if(n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  if(n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(n < 10485760 ? 1 : 0) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}
function fmtDate(ts, withTime=false){
  if(!ts) return '—';
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return '—';
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  if(!withTime) return `${y}.${m}.${day}`;
  return `${y}.${m}.${day} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtAmount(cents){
  if(cents == null || cents === '' || Number.isNaN(Number(cents))) return '';
  const n = Number(cents) / 100;
  return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
}
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function extOf(name){
  const m = String(name || '').toLowerCase().match(/\.([a-z0-9]{1,8})$/);
  return m ? m[1] : '';
}
function baseName(name){
  return String(name || '').replace(/\.[^.]+$/, '');
}
function sanitizeFileName(name){
  return String(name || '').replace(/[\x00-\x1f\x7f]/g, '').replace(/[\\/:*?"<>|]/g, '_').slice(0, 160) || '未命名文件';
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = sanitizeFileName(name);

  setTimeout(() => URL.revokeObjectURL(url), 1200);
}

}

/* ---------- IndexedDB ---------- */
let db = null;
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if(!d.objectStoreNames.contains('docs')) d.createObjectStore('docs', { keyPath:'id' });
      if(!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath:'id' });
      if(!d.objectStoreNames.contains('categories')) d.createObjectStore('categories', { keyPath:'id' });
      if(!d.objectStoreNames.contains('tags')) d.createObjectStore('tags', { keyPath:'id' });
      if(!d.objectStoreNames.contains('audit')) d.createObjectStore('audit', { keyPath:'id' });
      if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath:'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('无法打开本地数据库'));
    req.onblocked = () => reject(new Error('数据库被另一个窗口占用，请关闭重复页面后重试'));
  });
}
function dbAll(name){
  return new Promise((resolve, reject) => {
    const req = db.transaction(name, 'readonly').objectStore(name).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function dbGet(name, key){
  return new Promise((resolve, reject) => {
    const req = db.transaction(name, 'readonly').objectStore(name).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
function dbPut(name, value){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(name, 'readwrite');
    tx.objectStore(name).put(value);
    tx.oncomplete = () => resolve(value);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('写入被中止'));
  });
}
function dbPutMany(name, values){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(name, 'readwrite');
    const st = tx.objectStore(name);
    values.forEach(v => st.put(v));
    tx.oncomplete = () => resolve(values);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('写入被中止'));
  });
}
function dbDelete(name, key){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(name, 'readwrite');
    tx.objectStore(name).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function saveDocWithBlob(doc, blob){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['docs','blobs'], 'readwrite');
    tx.objectStore('docs').put(doc);
    if(blob) tx.objectStore('blobs').put({ id: doc.id, blob });
    tx.oncomplete = () => resolve(doc);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('文件写入失败，可能是存储空间不足'));
  });
}
function removeDocWithBlob(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['docs','blobs'], 'readwrite');
    tx.objectStore('docs').delete(id);
    tx.objectStore('blobs').delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function getBlob(id){
  return dbGet('blobs', id).then(r => r ? r.blob : null);
}

  const cats = await dbAll('categories');

    await dbPutMany('categories', DEFAULT_CATEGORIES.map(c => Object.assign({}, c)));

  if(!tags.length){
    await dbPutMany('tags', DEFAULT_TAGS.map(t => Object.assign({}, t)));
  }
  const settings = await dbGet('settings', 'main');
  if(!settings) await dbPut('settings', Object.assign({}, DEFAULT_SETTINGS));

  const watermark = !!current.watermark;

    state.settings = Object.assign({}, current, { id:'main', threshold, defaultCategoryId, watermark });
    try{ await dbPut('settings', state.settings); }catch(e){ console.warn('设置规范化写入失败', e); }
  }
}
async function clearAllStores(){

}

/* ---------- 分类 / 标签 ---------- */
function catById(id){ return state.categories.find(c => c.id === id) || null; }
function topCats(){ return state.categories.filter(c => !c.parentId).sort((a,b) => (a.sort||0)-(b.sort||0)); }
function childrenOf(id){ return state.categories.filter(c => c.parentId === id).sort((a,b) => (a.sort||0)-(b.sort||0)); }
function leafCats(){ return state.categories.filter(c => c.parentId); }
function isLeaf(id){ const c = catById(id); return !!c && !!c.parentId; }
function catPath(id){
  const c = catById(id);
  if(!c) return '未分类';
  if(c.parentId){ const p = catById(c.parentId); return (p ? p.name : '') + ' / ' + c.name; }
  return c.name;
}
function catTop(id){
  const c = catById(id);
  if(!c) return null;
  return c.parentId ? catById(c.parentId) : c;
}
function catIconName(id){
  const c = catById(id);
  const top = c && c.parentId ? catById(c.parentId) : c;
  return (top && top.icon) || 'folder';
}
function catColorClass(id){

function tagById(id){ return state.tags.find(t => t.id === id) || null; }
function tagName(id){ const t = tagById(id); return t ? t.name : id; }
function tagColor(id){ const t = tagById(id); return safeColor(t ? t.color : ''); }
function safeColor(v){ return /^#(?:[0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(String(v || '')) ? String(v) : '#8A8F87'; }
function tagsForDoc(doc){ return (doc.tags || []).map(tagById).filter(Boolean); }
function liveDocs(){ return state.docs.filter(d => !d.deletedAt); }
function deletedDocs(){ return state.docs.filter(d => d.deletedAt); }
function reviewDocs(){ return liveDocs().filter(d => d.status === 'need_review'); }
function docsInCategory(id){

    return liveDocs().filter(d => d.categoryId === id || kids.includes(d.categoryId));
  }
  return liveDocs().filter(d => d.categoryId === id);
}
function countCategory(id){ return docsInCategory(id).length; }
function uncategorizedCount(){ return liveDocs().filter(d => !d.categoryId || !isLeaf(d.categoryId)).length; }
function auditForDoc(id){

/* ---------- 文件类型与缩略图 ---------- */
function fileKind(doc){
  const ext = (doc.ext || extOf(doc.name)).toLowerCase();
  const mime = doc.mime || '';
  if(mime.startsWith('image/') || ['jpg','jpeg','png','gif','webp','bmp','heic','svg'].includes(ext)) return 'image';
  if(ext === 'pdf' || mime === 'application/pdf') return 'pdf';
  if(['txt','md','csv','json','log','xml','html','htm'].includes(ext) || mime.startsWith('text/')) return 'text';
  if(['doc','docx','rtf','odt'].includes(ext)) return 'word';
  if(['xls','xlsx','ods'].includes(ext)) return 'sheet';
  if(['mp3','wav','m4a','aac','ogg','flac'].includes(ext) || mime.startsWith('audio/')) return 'audio';
  if(['mp4','mov','webm','mkv','avi'].includes(ext) || mime.startsWith('video/')) return 'video';
  return 'other';
}
function kindIcon(kind){
  return { image:'image', pdf:'pdf', text:'file', word:'word', sheet:'sheet', audio:'audio', video:'video', other:'file' }[kind] || 'file';
}
function docIconName(doc){ return kindIcon(fileKind(doc)); }
async function makeImageThumb(file){
  if(!file.type.startsWith('image/')) return null;
  try{
    let bitmap;
    if(window.createImageBitmap){
      bitmap = await createImageBitmap(file);
    }else{
      const url = URL.createObjectURL(file);
      bitmap = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
      URL.revokeObjectURL(url);
    }
    const w = bitmap.width, h = bitmap.height;
    const scale = Math.min(1, 180 / Math.max(w, h));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(w * scale));
    canvas.height = Math.max(1, Math.round(h * scale));
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#F1ECE2'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    if(bitmap.close) bitmap.close();
    return canvas.toDataURL('image/jpeg', 0.72);
  }catch(e){ return null; }
}

/* ---------- 哈希 / 文本抽取 / 分类 ---------- */
async function hashFile(file){
  try{
    const buf = await file.arrayBuffer();
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      const digest = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
    }
    let h1 = 0x811c9dc5, h2 = 0x9e3779b9;
    const bytes = new Uint8Array(buf);
    for(let i=0;i<bytes.length;i++){
      h1 ^= bytes[i]; h1 = Math.imul(h1, 16777619) >>> 0;
      h2 ^= bytes[i]; h2 = Math.imul(h2, 2246822519) >>> 0;
    }
    return ('fnv_' + h1.toString(16) + h2.toString(16)).padEnd(20,'0');
  }catch(e){
    return 'fallback_' + file.name + '_' + file.size + '_' + (file.lastModified || 0);
  }
}

let pdfLibPromise = null, mammothPromise = null, xlsxPromise = null;
function loadScriptOnce(url, check){
  return new Promise((resolve, reject) => {
    if(check()){ resolve(true); return; }
    const s = document.createElement('script');
    s.src = url; s.async = true;
    s.onload = () => resolve(true);
    s.onerror = () => reject(new Error('依赖加载失败'));
    document.head.appendChild(s);
    setTimeout(() => reject(new Error('依赖加载超时')), 12000);
  });
}
async function ensurePdfLib(){
  if(!pdfLibPromise){
    pdfLibPromise = loadScriptOnce('https://fastly.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js', () => !!window.pdfjsLib)
      .then(() => {
        if(window.pdfjsLib && pdfjsLib.GlobalWorkerOptions){
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://fastly.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        }
        return window.pdfjsLib;
      })
      .catch(() => null);
  }
  return pdfLibPromise;
}
async function ensureMammoth(){
  if(!mammothPromise){
    mammothPromise = loadScriptOnce('https://fastly.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js', () => !!window.mammoth)
      .then(() => window.mammoth).catch(() => null);
  }
  return mammothPromise;
}
async function ensureXlsx(){
  if(!xlsxPromise){
    xlsxPromise = loadScriptOnce('https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js', () => !!window.XLSX)
      .then(() => window.XLSX).catch(() => null);
  }
  return xlsxPromise;
}
async function extractText(file, kind){
  try{
    if(kind === 'text'){
      const t = await file.slice(0, 2 * 1024 * 1024).text();
      return t.slice(0, TEXT_LIMIT);
    }
    if(kind === 'pdf'){
      const lib = await ensurePdfLib();
      if(!lib) return '';
      const data = new Uint8Array(await file.arrayBuffer());
      const pdf = await lib.getDocument({ data, disableAutoFetch:true, disableStream:true }).promise;
      let out = '', pages = Math.min(pdf.numPages, 3);
      for(let i=1;i<=pages;i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        out += content.items.map(it => it.str || '').join(' ') + '\n';
        if(out.length >= TEXT_LIMIT) break;
      }
      try{ pdf.destroy(); }catch(e){}
      return out.slice(0, TEXT_LIMIT);
    }
    if(kind === 'word'){
      const lib = await ensureMammoth();
      if(!lib) return '';
      const res = await lib.extractRawText({ arrayBuffer: await file.arrayBuffer() });
      return String(res.value || '').slice(0, TEXT_LIMIT);
    }
    if(kind === 'sheet'){
      const lib = await ensureXlsx();
      if(!lib) return '';
      const wb = lib.read(await file.arrayBuffer(), { type:'array', sheetRows:200 });
      let out = '';
      wb.SheetNames.slice(0, 3).forEach(n => {
        out += '[' + n + ']\n' + lib.utils.sheet_to_csv(wb.Sheets[n]).slice(0, 1200) + '\n';
      });
      return out.slice(0, TEXT_LIMIT);
    }
  }catch(e){ return ''; }
  return '';
}

function extractFields(name, text){
  const all = (name || '') + '\n' + (text || '');
  let amount_cents = null, doc_date = null, doc_no = null, party = null, summary = null;
  const amountMatch = all.match(/(?:价税合计|合计金额|总金额|金额|合计|总计|人民币|¥|￥)[ \t]*(?:（[^）]{0,12}）|\([^)]{0,12}\))?[ \t]*(?:为|是)?[ \t]*[:：]?[ \t]*(?:(?:¥|￥|人民币)[ \t]*)?([0-9][0-9,，]*(?:\.[0-9]{1,2})?)[ \t]*(?:元|块)?/);
  if(amountMatch){
    const n = parseFloat(amountMatch[1].replace(/[,，]/g,''));
    if(!Number.isNaN(n) && n >= 0 && n < 1e12) amount_cents = Math.round(n * 100);
  }
  const dateMatch = all.match(/(20[0-9]{2})\s*[-/.年]\s*(1[0-2]|0?[1-9])\s*[-/.月]\s*(3[01]|[12][0-9]|0?[1-9])(?!\d)\s*日?/);
  if(dateMatch) doc_date = `${dateMatch[1]}-${String(Number(dateMatch[2])).padStart(2,'0')}-${String(Number(dateMatch[3])).padStart(2,'0')}`;
  const noMatch = all.match(/(?:票号|发票号码|编号|单据号|合同编号|No\.?|NO\.?)\s*[:：]?\s*([A-Za-z0-9\-]{4,28})/i);
  if(noMatch) doc_no = noMatch[1].trim();
  const partyMatch = all.match(/(?:甲方|乙方|开票方|收款方|销售方|购买方|单位名称|姓名)\s*[:：]\s*([^\n，。；]{2,30})/);
  if(partyMatch) party = partyMatch[1].trim().slice(0, 30);
  const cleaned = String(text || '').replace(/\s+/g,' ').trim();
  if(cleaned.length >= 12) summary = cleaned.slice(0, 46);
  else summary = baseName(name).slice(0, 46);
  return { party, amount_cents, doc_date, doc_no, summary };
}

function guessDocType(name, text){
  const s = (name + ' ' + text).toLowerCase();
  if(s.includes('合同') || s.includes('协议')) return '合同';
  if(s.includes('发票')) return '发票';
  if(s.includes('收据')) return '收据';
  if(s.includes('证明')) return '证明';
  if(s.includes('报告')) return '报告';
  if(s.includes('证书')) return '证书';
  if(s.includes('通知')) return '通知';
  return '文件';
}

function classify(name, text){
  const n = String(name || '').toLowerCase();
  const t = String(text || '').toLowerCase();
  // 文件名里出现票据类词时，优先按票据处理；避免「房租发票」被「房租」和「租房」累计抢走。
  const ticketTriggers = ['发票','收据','行程单','机票','火车票','登机牌','小票','收款凭证'];
  const hasTicketTrigger = ticketTriggers.some(w => n.includes(w));
  const ticketRules = RULES.filter(r => ['cat_2_0','cat_2_1','cat_2_2','cat_2_3'].includes(r.id));
  let ticketBest = null;
  ticketRules.forEach(rule => {
    let score = 0, hitWord = '';
    rule.words.forEach(word => {
      if(n.includes(word.toLowerCase())){ score += 3.5; if(!hitWord) hitWord = word; }
    });
    if(hasTicketTrigger && score > 0 && (!ticketBest || score > ticketBest.score)) ticketBest = { id:rule.id, score, word:hitWord };
  });
  if(ticketBest){
    return {
      suggestedCategoryId: ticketBest.id,
      confidence: Number(Math.min(0.93, 0.5 + Math.min(ticketBest.score, 4.2) * 0.1).toFixed(2)),
      reason: `文件名命中票据关键词「${ticketBest.word}」，建议归入「${catPath(ticketBest.id)}」。`
    };
  }
  let best = null;
  RULES.forEach(rule => {
    let score = 0, hitWord = '';
    rule.words.forEach(word => {
      const w = word.toLowerCase();
      if(n.includes(w)){ score += 3.5; hitWord = word; }
      else if(t.includes(w)){ score += 1; if(!hitWord) hitWord = word; }
    });
    if(score > 0 && (!best || score > best.score)){
      best = { id:rule.id, score, word:hitWord };
    }
  });
  if(!best){
    return { suggestedCategoryId:null, confidence:0.25, reason:'文件名和正文里没有命中分类关键词，请手动选择。' };
  }
  const confidence = Math.min(0.93, 0.5 + Math.min(best.score, 4.2) * 0.1);
  return {
    suggestedCategoryId: best.id,
    confidence: Number(confidence.toFixed(2)),
    reason: `命中关键词「${best.word}」，建议归入「${catPath(best.id)}」。`
  };
}
</script>

<script>
/* ============================================================
   上传与本地处理
   ============================================================ */
function phaseText(item){
  const map = {
    waiting:'排队中', hashing:'计算指纹', duplicate:'重复文件',
    extracting:'读取内容', classifying:'判断分类', saving:'写入档案柜',
    done:'已完成', error:'失败'
  };
  return map[item.status] || '处理中';
}
function updateUploadQueueUI(){
  const el = document.getElementById('upload-queue');
  if(!el) return;
  if(!state.uploadQueue.length){
    el.innerHTML = '<div style="padding:14px 0;text-align:center;color:var(--muted);font-size:11.5px">还没有选择文件</div>';
  }else{
    el.innerHTML = state.uploadQueue.map(item => {
      const fileName = item.name || (item.file && item.file.name) || '未命名文件';
      const fileSize = item.size != null ? item.size : (item.file ? item.file.size : 0);
      const cls = item.status === 'done' ? (item.review ? 'dup' : 'ok') : item.status === 'error' ? 'err' : item.status === 'duplicate' ? 'dup' : '';
      const st = item.status === 'done' ? (item.restored ? (item.review ? '补回 · 待确认' : '已补回') : (item.review ? '待确认' : '已归档')) : item.status === 'error' ? '失败' : item.status === 'duplicate' ? '跳过' : phaseText(item);
      return `<div class="queue-item">
        <div class="q-icon">${icon(item.kind ? kindIcon(item.kind) : 'file', 'sm')}</div>
        <div style="min-width:0">
          <div class="q-name" title="${esc(fileName)}">${esc(fileName)}</div>
          <div class="q-meta">${esc(fmtSize(fileSize))}${item.message ? ' · ' + esc(item.message) : ''}</div>
        </div>
        <div class="q-status ${cls}">${esc(st)}</div>
      </div>`;
    }).join('');
  }
  const summary = document.getElementById('upload-summary');
  if(summary){
    if(!state.lastUploadSummary){
      summary.innerHTML = '';
    }else{
      const s = state.lastUploadSummary;
      summary.innerHTML = `<span>本次：归档 ${s.done} · 待确认 ${s.review}${s.restored ? ' · 补回 ' + s.restored : ''}${s.duplicate ? ' · 重复 ' + s.duplicate : ''}${s.error ? ' · 失败 ' + s.error : ''}</span>`;
    }
  }
  const countEl = document.getElementById('upload-queue-count');
  if(countEl){ countEl.textContent = `${state.uploadQueue.length} 个文件`; }
}

function addFiles(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  const busy = state.uploadRunning || state.uploadQueue.some(i => ['waiting','hashing','processing'].includes(i.status));
  if(!busy && state.uploadQueue.length){
    state.uploadQueue = [];
    state.lastUploadSummary = null;
  }
  let tooLarge = 0, empty = 0;
  files.forEach(file => {
    if(file.size === 0){ empty++; return; }
    if(file.size > MAX_FILE){ tooLarge++; return; }
    state.uploadQueue.push({
      id:uid('q'), file, name:file.name, size:file.size, status:'waiting', message:'', kind:fileKind({ name:file.name, ext:extOf(file.name), mime:file.type })
    });
  });
  state.lastUploadSummary = null;
  if(tooLarge) toast(`已跳过 ${tooLarge} 个大文件（单个上限 100 MB）`, true);
  if(empty) toast(`已跳过 ${empty} 个空文件`, true);
  updateUploadQueueUI();
  processQueue().catch(err => {
    console.error(err);
    state.uploadRunning = false;
    toast('上传队列收尾失败：' + (err && err.message ? err.message : '请刷新后重试'), true);
  });
}

async function processQueue(){
  if(state.uploadRunning) return;
  state.uploadRunning = true;
  updateUploadQueueUI();
  while(true){
    const item = state.uploadQueue.find(i => i.status === 'waiting');
    if(!item) break;
    try{
      await processOneFile(item);
    }catch(err){
      console.error(err);
      item.status = 'error';
      item.message = (err && err.message) ? err.message : '处理失败';
      item.file = null;
      updateUploadQueueUI();
    }
  }
  state.uploadRunning = false;
  if(!state.ready) return;
  await refreshDocs();
  const done = state.uploadQueue.filter(i => i.status === 'done' && !i.review && !i.restored).length;
  const review = state.uploadQueue.filter(i => i.status === 'done' && i.review && !i.restored).length;
  const restored = state.uploadQueue.filter(i => i.status === 'done' && i.restored).length;
  const duplicate = state.uploadQueue.filter(i => i.status === 'duplicate').length;
  const error = state.uploadQueue.filter(i => i.status === 'error').length;
  state.lastUploadSummary = { done, review, restored, duplicate, error };
  updateUploadQueueUI();
  await refreshStorageUI();
  render();
}

async function processOneFile(item){
  const file = item.file;
  item.kind = fileKind({ name:file.name, ext:extOf(file.name), mime:file.type });
  item.status = 'hashing'; item.message = ''; updateUploadQueueUI();

  const sha256 = await hashFile(file);
  const dup = state.docs.find(d => d.sha256 === sha256);
  if(dup){
    let dupBlob = null;
    try{ dupBlob = await getBlob(dup.id); }catch(e){}
    if(dupBlob){
      item.status = 'duplicate';
      item.message = dup.deletedAt ? `回收站中已有同文件：${dup.name}` : `已存在：${dup.name}`;
      item.file = null;
      updateUploadQueueUI();
      return;
    }
    // 备份导入的记录只有目录没有文件本体；重新上传同内容时补回文件，不再当作重复跳过。
    item.status = 'saving'; updateUploadQueueUI();
    const thumb = await makeImageThumb(file);
    const now = Date.now();
    dup.size = file.size;
    dup.mime = file.type || dup.mime;
    dup.ext = dup.ext || extOf(file.name);
    if(thumb) dup.thumb = thumb;
    dup.updatedAt = now;
    if(!dup.deletedAt && (dup.status === 'processing' || dup.status === 'failed')) dup.status = 'need_review';
    await saveDocWithBlob(dup, file);
    addAudit(dup.id, 'restore_file', `补回文件本体：${file.name}`);
    item.status = 'done';
    item.restored = true;
    item.review = !dup.deletedAt && dup.status === 'need_review';
    item.docId = dup.id;
    item.message = dup.deletedAt ? '回收站记录已补回文件' : (item.review ? '待确认 · 文件本体已补回' : '文件本体已补回');
    item.file = null;
    updateUploadQueueUI();
    return;
  }

  item.status = 'extracting'; updateUploadQueueUI();
  const text = await extractText(file, item.kind);
  const extracted = extractFields(file.name, text);
  let docType = guessDocType(file.name, text);
  if(docType === '文件'){
    docType = { image:'图片', pdf:'PDF', text:'文本', word:'文档', sheet:'表格', audio:'音频', video:'视频', other:'文件' }[item.kind] || '文件';
  }

  item.status = 'classifying'; updateUploadQueueUI();
  const ai = classify(file.name, text);
  // 拿不准时先落在默认叶子，状态仍然是待确认；用户确认后再移到建议分类。
  let categoryId = isLeaf(state.settings.defaultCategoryId) ? state.settings.defaultCategoryId : null;
  let status = 'need_review', review = true;
  const threshold = Number(state.settings.threshold) || 0.85;
  if(ai.suggestedCategoryId && isLeaf(ai.suggestedCategoryId) && ai.confidence >= threshold){
    categoryId = ai.suggestedCategoryId;
    status = 'ready';
    review = false;
  }

  item.status = 'saving'; updateUploadQueueUI();
  const thumb = await makeImageThumb(file);
  const now = Date.now();
  const doc = {
    id: uid('doc'),
    name: sanitizeFileName(file.name),
    ext: extOf(file.name),
    mime: file.type || '',
    size: file.size,
    sha256,
    categoryId,
    tags: [],
    docType,
    extracted,
    ai: {
      model: '本地规则',
      suggestedCategoryId: ai.suggestedCategoryId,
      confidence: ai.confidence,
      reason: ai.reason,
      at: now
    },
    status,
    source: 'web',
    createdAt: now,
    updatedAt: now,
    deletedAt: null,
    thumb
  };
  await saveDocWithBlob(doc, file);
  const existing = state.docs.findIndex(d => d.id === doc.id);
  if(existing >= 0) state.docs[existing] = doc; else state.docs.push(doc);
  addAudit(doc.id, 'upload', file.name);
  if(status === 'ready'){
    addAudit(doc.id, 'auto_classify', `规则建议置信度 ${Math.round(ai.confidence * 100)}%，自动归入「${catPath(categoryId)}」`);
  }else{
    addAudit(doc.id, 'pending', `未达自动归档阈值，等待人工确认${ai.reason ? '：' + ai.reason : ''}`);
  }

  item.status = 'done';
  item.review = review;
  item.docId = doc.id;
  item.message = review ? `待确认 · ${ai.suggestedCategoryId ? catPath(ai.suggestedCategoryId) : '未给出建议'}` : `已归档 · ${catPath(categoryId)}`;
  item.file = null;
  updateUploadQueueUI();
}

function csvCell(v){
  let s = v == null ? '' : String(v);
  // 防止 Excel / Numbers 把用户可控文本当成公式执行
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function buildCSV(rows){
  const head = ['文件名','档案类型','一级分类','二级分类','标签','对方/单位','金额(元)','文件日期','票号/编号','摘要','状态','大小(B)','SHA256','上传时间','删除时间'];
  const lines = [head.map(csvCell).join(',')];
  rows.forEach(d => {
    const cat = catById(d.categoryId);
    const l1 = cat && cat.parentId ? (catById(cat.parentId) || {}).name : (cat ? cat.name : '');
    const l2 = cat && cat.parentId ? cat.name : '';
    lines.push([
      d.name, d.docType || '', l1 || '', l2 || '',
      (d.tags || []).map(tagName).join('|'),
      (d.extracted && d.extracted.party) || '',
      d.extracted && d.extracted.amount_cents != null ? (d.extracted.amount_cents / 100).toFixed(2) : '',
      (d.extracted && d.extracted.doc_date) || '',
      (d.extracted && d.extracted.doc_no) || '',
      (d.extracted && d.extracted.summary) || '',
      d.deletedAt ? '回收站' : (STATUS_MAP[d.status] ? STATUS_MAP[d.status].label : d.status),
      d.size || 0, d.sha256 || '',
      fmtDate(d.createdAt, true), d.deletedAt ? fmtDate(d.deletedAt, true) : ''
    ].map(csvCell).join(','));
  });
  return '\ufeff' + lines.join('\r\n');
}
function exportCSV(rows, label='全部档案'){
  const safeLabel = String(label || '全部档案').replace(/[\\/:*?"<>|\r\n\t]/g, '_').slice(0, 60) || '全部档案';
  const name = `归档夹-${safeLabel}-${todayISO().replace(/-/g,'')}.csv`;
  downloadText(buildCSV(rows), name, 'text/csv;charset=utf-8');
  addAudit(null, 'export', `${label} · ${rows.length} 条`);
  toast(`已导出 ${rows.length} 条记录`);
}
function exportBackup(){
  const payload = {
    app:'归档夹', version:1, exportedAt:Date.now(),
    docs: state.docs,
    categories: state.categories,
    tags: state.tags,
    settings: state.settings,
    audit: state.audits
  };
  downloadText(JSON.stringify(payload, null, 2), `归档夹-备份-${todayISO().replace(/-/g,'')}.json`, 'application/json;charset=utf-8');
  addAudit(null, 'export', `JSON 备份 · ${state.docs.length} 条记录（不含文件本体）`);
  toast('备份已生成，不含文件本体');
}
function isSafeId(v){ return typeof v === 'string' && /^[A-Za-z0-9_-]{1,80}$/.test(v); }
function cleanImportedDoc(d){
  if(!d || typeof d !== 'object' || !isSafeId(d.id) || typeof d.name !== 'string') return null;
  const name = d.name.replace(/[\x00-\x1f\x7f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 180);
  if(!name) return null;
  const ex = d.extracted && typeof d.extracted === 'object' ? {
    party: String(d.extracted.party || '').slice(0, 120),
    amount_cents: d.extracted.amount_cents != null && Number.isFinite(Number(d.extracted.amount_cents)) ? Math.max(0, Number(d.extracted.amount_cents)) : null,
    doc_date: String(d.extracted.doc_date || '').slice(0, 20),
    doc_no: String(d.extracted.doc_no || '').slice(0, 80),
    summary: String(d.extracted.summary || '').slice(0, 300)
  } : {};
  const ai = d.ai && typeof d.ai === 'object' ? {
    model: String(d.ai.model || '本地规则').slice(0, 40),
    suggestedCategoryId: isSafeId(d.ai.suggestedCategoryId) ? d.ai.suggestedCategoryId : null,
    confidence: Number.isFinite(Number(d.ai.confidence)) ? Math.max(0, Math.min(1, Number(d.ai.confidence))) : 0,
    reason: String(d.ai.reason || '').slice(0, 300),
    at: d.ai.at != null && Number.isFinite(Number(d.ai.at)) ? Number(d.ai.at) : Date.now()
  } : null;
  const thumb = typeof d.thumb === 'string' && /^data:image\/(?:png|jpe?g|webp|gif);base64,/i.test(d.thumb) && d.thumb.length < 400000 ? d.thumb : null;
  return {
    id:d.id, name,
    ext:String(d.ext || '').slice(0, 20), mime:String(d.mime || '').slice(0, 100),
    size:Number.isFinite(Number(d.size)) ? Math.max(0, Number(d.size)) : 0,
    sha256:typeof d.sha256 === 'string' ? d.sha256.slice(0, 80) : null,
    categoryId:isSafeId(d.categoryId) ? d.categoryId : null,
    tags:Array.isArray(d.tags) ? d.tags.filter(isSafeId).slice(0, 100) : [],
    docType:String(d.docType || '').slice(0, 20), extracted:ex,
    ai, status:['ready','need_review','processing','failed'].includes(d.status) ? d.status : 'ready',
    source:String(d.source || 'import').slice(0, 120),
    createdAt:d.createdAt != null && Number.isFinite(Number(d.createdAt)) ? Number(d.createdAt) : Date.now(),
    updatedAt:d.updatedAt != null && Number.isFinite(Number(d.updatedAt)) ? Number(d.updatedAt) : Date.now(),
    deletedAt:d.deletedAt != null && Number.isFinite(Number(d.deletedAt)) ? Number(d.deletedAt) : null,
    thumb
  };
}
function cleanImportedCategory(c){
  if(!c || !isSafeId(c.id) || typeof c.name !== 'string') return null;
  const name = c.name.replace(/[\x00-\x1f\x7f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 20);
  if(!name) return null;
  const parentId = isSafeId(c.parentId) && c.parentId !== c.id ? c.parentId : null;
  return {
    id:c.id, parentId, name,
    icon:typeof c.icon === 'string' ? c.icon.slice(0, 20) : 'folder',
    sort:Number.isFinite(Number(c.sort)) ? Number(c.sort) : 0,
    color:['pine','gold','rust','sage','ink'].includes(c.color) ? c.color : 'pine'
  };
}
function cleanImportedTag(t){
  if(!t || !isSafeId(t.id) || typeof t.name !== 'string') return null;
  const name = t.name.replace(/[\x00-\x1f\x7f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 12);
  if(!name) return null;
  return { id:t.id, name, color:safeColor(t.color) };
}
function cleanImportedAudit(a){
  if(!a || !isSafeId(a.id) || typeof a.action !== 'string') return null;
  return {
    id:a.id, docId:isSafeId(a.docId) ? a.docId : null,
    action:a.action.slice(0, 40), detail:String(a.detail || '').slice(0, 300),
    at:a.at != null && Number.isFinite(Number(a.at)) ? Number(a.at) : Date.now()
  };
}
async function applyImportedBackup(pending){
  const existing = new Map(state.docs.map(d => [d.id, d]));
  let added = 0, updated = 0;
  for(const d of pending.docs){
    if(existing.has(d.id)) updated++; else added++;
  }
  if(pending.docs.length) await dbPutMany('docs', pending.docs);
  const catIds = new Set(state.categories.map(c => c.id));
  const newCats = pending.cats.filter(c => !catIds.has(c.id));
  if(newCats.length) await dbPutMany('categories', newCats);
  const tagIds = new Set(state.tags.map(t => t.id));
  const newTags = pending.tags.filter(t => !tagIds.has(t.id));
  if(newTags.length) await dbPutMany('tags', newTags);
  const auditIds = new Set(state.audits.map(a => a.id));
  const newAudits = pending.audits.filter(a => !auditIds.has(a.id));
  if(newAudits.length) await dbPutMany('audit', newAudits);
  await reloadAll();
  if(pending.settings){
    const next = Object.assign({}, state.settings);
    if(Number.isFinite(pending.settings.threshold)) next.threshold = Math.max(0.5, Math.min(0.95, pending.settings.threshold));
    if(typeof pending.settings.watermark === 'boolean') next.watermark = pending.settings.watermark;
    if(isLeaf(pending.settings.defaultCategoryId)) next.defaultCategoryId = pending.settings.defaultCategoryId;
    state.settings = next;
    await dbPut('settings', next);
  }
  addAudit(null, 'import', `合并 ${added} 条，覆盖 ${updated} 条（不含文件本体）`);
  render();
  toast(`导入完成：新增 ${added} 条，覆盖 ${updated} 条。文件本体需重新上传。`);
}
function importBackup(file){
  if(state.uploadRunning){ toast('正在处理上传，等这批完成后再导入', true); return; }
  if(file.size > 50 * 1024 * 1024){ toast('备份文件超过 50 MB，先在源设备拆分导出', true); return; }
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(String(reader.result || '{}'));
      if(data.app !== '归档夹' || !Array.isArray(data.docs)) throw new Error('不是归档夹的备份文件');
      const docs = data.docs.map(cleanImportedDoc).filter(Boolean);
      const cats = Array.isArray(data.categories) ? data.categories.map(cleanImportedCategory).filter(Boolean) : [];
      const tags = Array.isArray(data.tags) ? data.tags.map(cleanImportedTag).filter(Boolean) : [];
      const audits = Array.isArray(data.audit) ? data.audit.map(cleanImportedAudit).filter(Boolean) : [];
      const settings = data.settings && typeof data.settings === 'object' ? {
        threshold:data.settings.threshold != null && Number.isFinite(Number(data.settings.threshold)) ? Number(data.settings.threshold) : null,
        defaultCategoryId:isSafeId(data.settings.defaultCategoryId) ? data.settings.defaultCategoryId : null,
        watermark:typeof data.settings.watermark === 'boolean' ? data.settings.watermark : null
      } : null;
      let added = 0, updated = 0;
      const existing = new Set(state.docs.map(d => d.id));
      docs.forEach(d => { if(existing.has(d.id)) updated++; else added++; });
      const pending = { docs, cats, tags, audits, settings };
      showConfirm('导入备份',
        `已读取 <b>${docs.length}</b> 条文件记录（新增 ${added} 条，覆盖 ${updated} 条），以及 ${cats.length} 个分类、${tags.length} 个标签。<br><br>只恢复目录、识别信息和缩略图，<b>不含文件本体</b>。导入后会与当前数据合并，同 ID 的记录以备份为准。`,
        async () => { await applyImportedBackup(pending); },
        { okText:'合并导入' });
    }catch(err){
      toast('导入失败：' + (err.message || '文件格式不正确'), true);
    }
  };
  reader.onerror = () => toast('备份文件读不出来，换一个文件再试', true);
  reader.readAsText(file);
}

function parseRoute(){
  const raw = (location.hash || '#/home').replace(/^#\/?/, '');
  if(raw.startsWith('doc/')){
    let id = raw.slice(4);
    try{ id = decodeURIComponent(id); }catch(e){ /* 保留原始片段，避免坏链接直接报错 */ }
    return { view:'detail', id };
  }
  const known = ['home','list','review','trash','settings'];
  return { view: known.includes(raw) ? raw : 'home' };
}
function applyHash(){
  const route = parseRoute();
  if(route.view === 'detail'){
    if(state.detailId && state.detailId !== route.id) releasePreview();
    state.view = 'detail';
    state.detailId = route.id;
  }else{
    state.view = route.view;
    state.detailId = null;
    releasePreview();
  }
  render();
}
function navigate(view, opts={}){
  if(opts.reset) { state.page = 1; state.selected.clear(); }
  if(opts.filters){
    Object.assign(state.filters, opts.filters);
    state.page = 1;
    state.selected.clear();
  }
  const hash = '#/' + view;
  if(location.hash === hash) render(); else location.hash = hash;

function releasePreview(){
  if(state.previewUrl){ try{ URL.revokeObjectURL(state.previewUrl); }catch(e){} state.previewUrl = null; }

}
function currentFilterCount(base, afterCategory){
  return filterDocs(afterCategory).length;

function filterDocs(docs){
  const q = state.query.trim().toLowerCase();
  return docs.filter(d => {
    if(state.filters.status && d.status !== state.filters.status) return false;
    if(state.filters.tag && !(d.tags || []).includes(state.filters.tag)) return false;
    if(state.filters.type && d.docType !== state.filters.type) return false;
    if(state.filters.year){
      const y = new Date(d.createdAt).getFullYear();
      if(String(y) !== String(state.filters.year)) return false;
    }
    if(q){
      const hay = [
        d.name, d.docType, catPath(d.categoryId),
        d.extracted && d.extracted.summary, d.extracted && d.extracted.party,
        d.extracted && d.extracted.doc_no, (d.tags || []).map(tagName).join(' ')
      ].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function sortDocs(docs){
  const rows = docs.slice();
  if(state.sort === 'old') rows.sort((a,b) => (a.createdAt||0)-(b.createdAt||0));
  else if(state.sort === 'name') rows.sort((a,b) => a.name.localeCompare(b.name, 'zh-CN'));
  else if(state.sort === 'amount'){
    rows.sort((a,b) => ((b.extracted && b.extracted.amount_cents) || 0) - ((a.extracted && a.extracted.amount_cents) || 0));
  }else rows.sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
  return rows;
}

      <option value="">全部类型</option>
      ${types.map(t => `<option value="${esc(t)}" ${state.filters.type === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}

    <select class="select" data-filter="year" aria-label="按年份筛选">
      <option value="">全部年份</option>

    <span class="spacer"></span>
    <select class="select" data-sort aria-label="排序">
      <option value="new" ${state.sort === 'new' ? 'selected' : ''}>最新入档</option>
      <option value="old" ${state.sort === 'old' ? 'selected' : ''}>最早入档</option>
      <option value="name" ${state.sort === 'name' ? 'selected' : ''}>按文件名</option>

  </div>
  <div class="row between" style="margin-top:14px">

    <div class="row gap8">
      <button class="btn btn-ghost sm" data-action="prev-page" ${state.page <= 1 ? 'disabled' : ''}>上一页</button>
      <button class="btn btn-ghost sm" data-action="next-page" ${state.page >= pageCount ? 'disabled' : ''}>下一页</button>
    </div>
  </div>` : `<div class="empty">
    <div class="art"><div class="tab"></div><div class="back"></div><div class="front"></div></div>
    <div class="t">${hasFilter ? '这个条件下没有文件' : '还没有档案'}</div>

    <div class="row gap8" style="justify-content:center">
      ${hasFilter ? '<button class="btn btn-ghost" data-action="clear-filters">清除筛选</button>' : ''}

  ${state.selected.size ? `<div class="batch-bar">

  </div>` : ''}`;

function renderReview(){
  const docs = reviewDocs().sort((a,b) => (a.createdAt||0)-(b.createdAt||0));
  return `<div class="breadcrumb"><a href="#/home">归档夹</a><span>/</span><span>待确认</span></div>
  <div class="page-head">
    <div><h2>待确认</h2><div class="sub">${docs.length ? `${docs.length} 份文件还在门口，确认后才算正式归档。` : '门口是空的。'}</div></div>
    ${docs.length ? `<button class="btn btn-soft sm" data-action="review-all-suggest">${icon('spark','sm')}全部按建议归档</button>` : ''}
  </div>
  <div class="section-note">
    ${icon('info','sm')}
    <div class="grow">这里只做建议，不替你做决定。分类规则来自文件名和正文关键词，置信度没到 ${Math.round((Number(state.settings.threshold)||0.85)*100)}% 的一律停在这里。确认后可以在详情里继续改。</div>
  </div>
  ${docs.length ? docs.map(d => {
    const ai = suggestionFor(d);
    const suggested = ai && ai.suggestedCategoryId ? catPath(ai.suggestedCategoryId) : '';
    return `<div class="review-card">
      <div class="review-top">
        ${docThumbHtml(d)}
        <div style="min-width:0">
          <div class="doc-name ellipsis">${esc(d.name)}</div>
          <div class="doc-meta"><span>${esc(fmtSize(d.size))}</span><i class="sep"></i><span>${esc(fmtDate(d.createdAt, true))}</span><i class="sep"></i><span>${esc(d.docType || '文件')}</span></div>
        </div>
        <div class="side">${statusChip(d)}</div>
      </div>
      ${ai ? `<div class="suggest">
        <span class="path">${icon('spark','sm')} ${esc(suggested || '暂无建议')}</span>
        <span class="conf">把握 ${Math.round((ai.confidence||0)*100)}%</span>
        <span class="reason">${esc(ai.reason || '')}</span>
      </div>` : `<div class="suggest"><span class="path">暂无分类建议</span><span class="reason">可以手动选择，或先打开详情看看内容。</span></div>`}
      <div class="review-actions">
        ${ai && ai.suggestedCategoryId ? `<button class="btn sm btn-primary" data-action="confirm-suggestion" data-id="${d.id}">${icon('check','sm')}按建议归档</button>` : ''}
        <button class="btn sm btn-ghost" data-action="change-cat" data-id="${d.id}">手动分类</button>
        <button class="btn sm btn-plain" data-action="review-later" data-id="${d.id}">稍后处理</button>
        <button class="btn sm btn-plain" data-action="open-doc" data-id="${d.id}">看详情 →</button>
      </div>
    </div>`;
  }).join('') : `<div class="empty">
    <div class="art"><div class="tab"></div><div class="back"></div><div class="front"></div></div>
    <div class="t">都确认完了</div>
    <div class="s">没有拿不准的文件。新上传的文件如果置信度不够，会重新出现在这里。</div>
    <button class="btn btn-primary" data-action="open-upload">${icon('upload','sm')}继续添加</button>
  </div>`}`;
}
function renderTrash(){
  const docs = deletedDocs().sort((a,b) => (b.deletedAt||0)-(a.deletedAt||0));
  return `<div class="breadcrumb"><a href="#/home">归档夹</a><span>/</span><span>回收站</span></div>
  <div class="page-head">
    <div><h2>回收站</h2><div class="sub">${docs.length ? `${docs.length} 份文件在这里暂存，恢复后回到原来的分类。` : '没有待清理的文件。'}</div></div>
    ${docs.length ? `<div class="row gap8">
      <button class="btn btn-ghost sm" data-action="export-trash">${icon('download','sm')}导出回收站</button>
      <button class="btn btn-danger sm" data-action="empty-trash">${icon('trash','sm')}清空回收站</button>
    </div>` : ''}
  </div>
  <div class="section-note">
    ${icon('shield','sm')}
    <div class="grow">删除是软删除：文件和元数据仍然留在本机，随时可以恢复。只有「彻底删除」会真正移除文件本体。</div>
  </div>
  ${docs.length ? `<div class="list-wrap">
    ${docs.map(d => `<div class="doc-row" data-action="open-doc" data-id="${d.id}" role="button" tabindex="0" aria-label="查看 ${esc(d.name)}" style="grid-template-columns:46px minmax(0,1fr) auto">
      ${docThumbHtml(d)}
      <div class="grow" style="min-width:0">
        <div class="doc-name ellipsis">${esc(d.name)}</div>
        <div class="doc-meta"><span>${esc(catPath(d.categoryId))}</span><i class="sep"></i><span>${esc(fmtSize(d.size))}</span><i class="sep"></i><span>删除于 ${esc(fmtDate(d.deletedAt, true))}</span></div>
      </div>
      <div class="row gap8">
        <button class="btn sm btn-soft" data-action="restore-doc" data-id="${d.id}">${icon('restore','sm')}恢复</button>
        <button class="icon-btn danger" data-action="purge-doc" data-id="${d.id}" title="彻底删除">${icon('trash','sm')}</button>
      </div>
    </div>`).join('')}
  </div>` : `<div class="empty">
    <div class="art"><div class="tab"></div><div class="back"></div><div class="front"></div></div>
    <div class="t">回收站是空的</div>
    <div class="s">误删的文件会先落到这里，不会立刻消失。</div>
    <a class="btn btn-primary" href="#/home">回到归档</a>
  </div>`}`;
}
