<script>
/* ============================================================
   详情页
   ============================================================ */
function isSensitive(doc){
  const tops = [doc.categoryId, doc.ai && doc.ai.suggestedCategoryId]
    .map(catTop)
    .filter(Boolean);
  return tops.some(top => top.id === 'cat_0' || top.id === 'cat_4' || /证件|身份|医疗|健康|体检|病历/.test(top.name));
}
function renderDetail(){
  const doc = state.docs.find(d => d.id === state.detailId);
  if(!doc){
    return `<div class="empty" style="margin-top:80px">
      <div class="art"><div class="tab"></div><div class="back"></div><div class="front"></div></div>
      <div class="t">这份档案不在了</div>
      <div class="s">它可能已经被彻底删除，或者备份导入的记录没有文件本体。</div>
      <a class="btn btn-primary" href="#/list">回到全部档案</a>
    </div>`;
  }
  const cat = catPath(doc.categoryId);
  const ai = suggestionFor(doc);
  const wm = state.settings.watermark && isSensitive(doc);
  const audits = auditForDoc(doc.id).slice(0, 8);
  const amount = doc.extracted && doc.extracted.amount_cents != null ? (doc.extracted.amount_cents / 100).toFixed(2) : '';
  const backView = state.detailBack || 'list';
  return `<div class="breadcrumb">
    <a href="#/home">归档夹</a><span>/</span><a href="#/${backView}">${backView === 'review' ? '待确认' : backView === 'trash' ? '回收站' : backView === 'home' ? '归档' : '全部档案'}</a><span>/</span><span class="ellipsis" style="max-width:280px">${esc(doc.name)}</span>
  </div>
  <div class="page-head">
    <div style="min-width:0">
      <h2 style="word-break:break-word">${esc(doc.name)}</h2>
      <div class="sub">${esc(doc.docType || '文件')} · ${esc(fmtSize(doc.size))} · 上传于 ${esc(fmtDate(doc.createdAt, true))} · ${esc(cat)}</div>
    </div>
    <div class="row gap8 wrap">
      <button class="btn btn-ghost sm" data-action="download-doc" data-id="${doc.id}">${icon('download','sm')}下载原文件</button>
      <button class="btn btn-ghost sm" data-action="change-cat" data-id="${doc.id}">${icon('folder','sm')}移动分类</button>
      ${doc.deletedAt
        ? `<button class="btn btn-soft sm" data-action="restore-doc" data-id="${doc.id}">${icon('restore','sm')}恢复</button>
           <button class="btn btn-danger sm" data-action="purge-doc" data-id="${doc.id}">${icon('trash','sm')}彻底删除</button>`
        : `<button class="btn btn-danger sm" data-action="delete-doc" data-id="${doc.id}">${icon('trash','sm')}移入回收站</button>`}
    </div>
  </div>

  ${doc.deletedAt ? `<div class="section-note" style="background:var(--rust-soft);border-color:#E7C3B7;color:#8B4032">${icon('warning','sm')}<div class="grow">这份档案在回收站里，恢复后会回到原来的分类；彻底删除会连同文件本体一起移除。</div></div>` : ''}

  <div class="detail-grid">
    <div>
      <div class="preview-panel" id="preview-panel">
        <div id="preview-stage" class="preview-stage">
          <div style="text-align:center;color:var(--muted);font-size:12px">正在读取本地文件…</div>
        </div>
        ${wm ? `<div class="watermark-grid"></div><div class="watermark">归档夹 · 仅限本人查阅</div>` : ''}
        <div class="preview-caption">本地预览 · 不上传 · ${wm ? '敏感件已加查看水印' : '文件只在这台设备'}</div>
      </div>
      <div class="meta-card" style="margin-top:14px">
        <h3>文件名 <span class="small muted" style="font-weight:400">改名不会改变文件内容</span></h3>
        <div class="field" style="margin-bottom:0">
          <div class="row gap8">
            <input id="doc-name-input" value="${esc(doc.name)}" aria-label="文件名" maxlength="180">
            <button class="btn sm btn-soft" data-action="save-name" data-id="${doc.id}">保存</button>
          </div>
        </div>
      </div>
    </div>

    <div>
      ${doc.status === 'need_review' && !doc.deletedAt ? `<div class="meta-card" style="border-color:#E0CDA6;background:#FCF6E9">
        <h3>归档建议 ${ai ? `<span class="conf" style="font-size:10px;color:#A07C3D;border:1px solid #DFC895;border-radius:4px;padding:1px 5px">把握 ${Math.round((ai.confidence||0)*100)}%</span>` : ''}</h3>
        <div style="font-size:13px;font-weight:600;color:#7D5B20;margin-bottom:5px">${ai && ai.suggestedCategoryId ? esc(catPath(ai.suggestedCategoryId)) : '这次没有给出建议'}</div>
        <div class="small" style="color:#8A744D;line-height:1.75">${esc(ai && ai.reason ? ai.reason : '文件名和正文没有命中规则，手动选一个就好。')}</div>
        <div class="set-actions">
          ${ai && ai.suggestedCategoryId ? `<button class="btn sm btn-primary" data-action="confirm-suggestion" data-id="${doc.id}">${icon('check','sm')}采纳建议</button>` : ''}
          <button class="btn sm btn-ghost" data-action="change-cat" data-id="${doc.id}">手动分类</button>
        </div>
      </div>` : ''}

      <div class="meta-card">
        <h3>档案信息 <button class="btn sm btn-plain" data-action="edit-tags" data-id="${doc.id}">编辑标签</button></h3>
        <div class="meta-line"><span class="k">分类</span><span class="v link" data-action="change-cat" data-id="${doc.id}">${esc(cat)} →</span></div>
        <div class="meta-line"><span class="k">状态</span><span class="v">${statusChip(doc)}</span></div>
        <div class="meta-line"><span class="k">标签</span><span class="v" style="display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end">${tagPills(doc, 99) || '<span class="muted">未设置</span>'}</span></div>
        <div class="meta-line"><span class="k">类型</span><span class="v">${esc(doc.docType || '文件')}</span></div>
        <div class="meta-line"><span class="k">大小</span><span class="v">${esc(fmtSize(doc.size))}</span></div>
        <div class="meta-line"><span class="k">上传</span><span class="v">${esc(fmtDate(doc.createdAt, true))}</span></div>
        <div class="meta-line"><span class="k">指纹</span><span class="v mono" style="font-size:10px;max-width:190px;word-break:break-all">${doc.sha256 ? `${esc(doc.sha256.slice(0, 18))}… <button class="btn btn-plain sm" style="height:auto;padding:0;font-size:10px" data-action="copy-sha" data-id="${doc.id}">复制</button>` : '<span class="muted">没有记录</span>'}</span></div>
      </div>

      <div class="meta-card">
        <h3>识别信息 <button class="btn sm btn-soft" data-action="save-extracted" data-id="${doc.id}">保存</button></h3>

function sanitizeDocHtml(html){
  const parsed = new DOMParser().parseFromString(String(html || ''), 'text/html');
  parsed.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,img,svg,video,audio,source').forEach(el => el.remove());
  parsed.querySelectorAll('*').forEach(el => {
    Array.from(el.attributes).forEach(attr => {
      if(attr.name !== 'colspan' && attr.name !== 'rowspan') el.removeAttribute(attr.name);
    });
  });
  return parsed.body.innerHTML || '';
}
async function renderWordPreview(stage, blob){
  const lib = await ensureMammoth();
  if(!lib) throw new Error('Word 解析库没有加载成功');
  const result = await lib.convertToHtml({arrayBuffer: await blob.arrayBuffer()}, {ignoreEmptyParagraphs:true});
  const html = sanitizeDocHtml(result && result.value);
  stage.innerHTML = `<div class="preview-richtext">${html || '<p class="muted">没有读出可显示的正文。</p>'}</div>
    <div class="preview-note">Word 文本预览 · 复杂版式可能简化，原文件请从上方下载</div>`;
}
function sheetColumnName(i){
  let name = '';
  let n = i;
  do{ name = String.fromCharCode(65 + (n % 26)) + name; n = Math.floor(n / 26) - 1; }while(n >= 0);
  return name;
}
async function renderSheetPreview(stage, blob){
  const lib = await ensureXlsx();
  if(!lib) throw new Error('表格解析库没有加载成功');
  const workbook = lib.read(await blob.arrayBuffer(), {type:'array', sheetRows:61});
  if(!workbook.SheetNames.length) throw new Error('表格里没有工作表');
  const sheetName = workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const allRows = lib.utils.sheet_to_json(sheet, {header:1, blankrows:false, defval:''});
  if(!allRows.length) throw new Error('工作表是空的');
  const rows = allRows.slice(0, 60);
  const cols = Math.max(1, Math.min(14, allRows.reduce((max, row) => Math.max(max, row.length), 1)));
  const head = Array.from({length:cols}, (_, i) => `<th>${sheetColumnName(i)}</th>`).join('');
  const body = rows.map((row, ri) => {
    const cells = Array.from({length:cols}, (_, ci) => {
      const value = row[ci] == null ? '' : String(row[ci]);
      return `<td title="${esc(value.slice(0, 180))}">${esc(value.slice(0, 180))}</td>`;
    }).join('');
    return `<tr><td class="row-no">${ri + 1}</td>${cells}</tr>`;
  }).join('');
  stage.innerHTML = `<div class="preview-table-wrap">
      <table class="preview-table">
        <thead><tr><th class="row-no">#</th>${head}</tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <div class="preview-note">工作表「${esc(sheetName)}」${workbook.SheetNames.length > 1 ? ` · 共 ${workbook.SheetNames.length} 个工作表，只预览第一个` : ''} · 最多显示前 60 行、14 列，原文件请从上方下载</div>`;
}

async function loadPreview(id){
  const doc = state.docs.find(d => d.id === id);
  const stage = document.getElementById('preview-stage');
  releasePreview();
  if(!doc || !stage) return;
  const kind = fileKind(doc);
  const placeholder = (title, sub, iconName) => {
    stage.innerHTML = `<div class="preview-placeholder">
      <div class="big-icon">${icon(iconName || 'file','lg')}</div>
      <div class="t">${esc(title)}</div>
      <div class="small" style="max-width:340px;margin:0 auto;line-height:1.8">${esc(sub)}</div>
      <div style="margin-top:16px"><button class="btn sm btn-ghost" data-action="download-doc" data-id="${doc.id}">${icon('download','sm')}下载后用本地应用打开</button></div>
    </div>`;
  };
  let blob;
  try{ blob = await getBlob(doc.id); }catch(e){ blob = null; }
  if(state.view !== 'detail' || state.detailId !== id) return;
  if(!blob){
    placeholder('文件本体不在这台设备', '这条记录可能来自 JSON 备份导入。备份只含目录信息，文件需要重新上传。', 'archive');
    return;
  }
  try{
    if(kind === 'image'){
      state.previewUrl = URL.createObjectURL(blob);
      stage.innerHTML = `<img class="preview-image" src="${state.previewUrl}" alt="${esc(doc.name)}">`;
    }else if(kind === 'pdf'){
      state.previewUrl = URL.createObjectURL(blob);
      stage.innerHTML = `<iframe class="preview-frame" src="${state.previewUrl}#toolbar=1&navpanes=0&view=FitH" title="${esc(doc.name)}"></iframe>`;
    }else if(kind === 'text'){
      const text = await blob.slice(0, 2 * 1024 * 1024).text();
      if(state.view !== 'detail' || state.detailId !== id) return;
      stage.innerHTML = `<pre class="preview-text">${esc(text.slice(0, 60000))}${text.length > 60000 ? '\n\n…（预览截断，完整内容请下载）' : ''}</pre>`;
    }else if(kind === 'audio'){
      state.previewUrl = URL.createObjectURL(blob);
      stage.innerHTML = `<div style="width:100%;padding:40px 28px;text-align:center"><div style="margin-bottom:16px;color:var(--pine)">${icon('audio','xl')}</div><audio controls src="${state.previewUrl}" style="width:100%;max-width:440px"></audio><div class="small muted" style="margin-top:10px">${esc(doc.name)}</div></div>`;
    }else if(kind === 'video'){
      state.previewUrl = URL.createObjectURL(blob);
      stage.innerHTML = `<video controls src="${state.previewUrl}" style="width:100%;max-height:72vh;background:#1E2823"></video>`;
    }else if(kind === 'word'){
      await renderWordPreview(stage, blob);
    }else if(kind === 'sheet'){
      await renderSheetPreview(stage, blob);
    }else{
      placeholder('这类文件暂不支持预览', '原文件完好地存在本机，下载后就能打开。', kindIcon(kind));
    }
  }catch(err){
    placeholder('预览失败', '文件可能已被清理，或者浏览器不支持这种格式。可以尝试下载原文件。', 'warning');
  }
}

   业务动作

async function moveDocTo(id, categoryId, opts={}){
  if(!isLeaf(categoryId)){ toast('只能归档到二级分类', true); return false; }
  const doc = state.docs.find(d => d.id === id);
  if(!doc){ toast('文件不存在', true); return false; }
  const old = doc.categoryId;
  const sameCategory = old === categoryId;
  if(sameCategory && doc.status === 'ready'){ toast('已经在这个分类'); return false; }
  doc.categoryId = categoryId;
  doc.status = 'ready';
  doc.updatedAt = Date.now();
  await dbPut('docs', doc);
  addAudit(doc.id, opts.action || 'move', sameCategory ? '确认归档' : `「${catPath(old)}」→「${catPath(categoryId)}」`);
  await refreshDocs();
  toast(sameCategory ? '已确认归档' : `已归入「${catPath(categoryId)}」`);
  return true;
}
async function adoptSuggestion(id){
  const doc = state.docs.find(d => d.id === id);
  if(!doc || !doc.ai || !doc.ai.suggestedCategoryId) return;
  await moveDocTo(id, doc.ai.suggestedCategoryId, { action:'review' });
}
async function softDeleteDoc(id){
  const doc = state.docs.find(d => d.id === id);
  if(!doc) return;
  doc.deletedAt = Date.now();
  doc.updatedAt = doc.deletedAt;
  await dbPut('docs', doc);
  addAudit(doc.id, 'delete', '移入回收站');
  state.selected.delete(doc.id);
  await refreshDocs();
  toast('已移入回收站，可随时恢复');
  if(state.view === 'detail') navigate(state.detailBack || 'list'); else render();
}
async function restoreDoc(id){
  const doc = state.docs.find(d => d.id === id);
  if(!doc) return;
  if(!doc.deletedAt){ toast('这份文件不在回收站'); return; }
  const dup = state.docs.find(d => d.id !== id && !d.deletedAt && d.sha256 && d.sha256 === doc.sha256);
  if(dup){ toast(`不能恢复：在库已有同文件「${dup.name}」`, true); return; }
  doc.deletedAt = null;
  doc.updatedAt = Date.now();
  await dbPut('docs', doc);
  addAudit(doc.id, 'restore', '从回收站恢复');
  await refreshDocs();
  toast('已恢复到原分类');
  if(state.view === 'detail') navigate(state.detailBack === 'trash' ? 'list' : (state.detailBack || 'list')); else render();
}
async function purgeDoc(id){
  const doc = state.docs.find(d => d.id === id);
  if(!doc) return;
  showConfirm('彻底删除', `确定彻底删除 <strong>${esc(doc.name)}</strong>？文件本体和缩略图会从本机移除，操作记录保留，但文件无法再恢复。`, async () => {
    await removeDocWithBlob(doc.id);
    addAudit(doc.id, 'purge', doc.name);
    state.docs = state.docs.filter(d => d.id !== doc.id);
    state.selected.delete(doc.id);
    await refreshDocs();
    toast('已彻底删除');
    if(state.view === 'detail') navigate(state.detailBack || 'list'); else render();
  }, { danger:true, okText:'彻底删除' });
}
async function batchMove(ids, categoryId){
  if(!isLeaf(categoryId)){ toast('只能归档到二级分类', true); return; }
  const docs = state.docs.filter(d => ids.includes(d.id));
  for(const d of docs){
    d.categoryId = categoryId;
    d.status = 'ready';
    d.updatedAt = Date.now();
  }
  if(docs.length) await dbPutMany('docs', docs);
  docs.forEach(d => addAudit(d.id, 'move', `批量归入「${catPath(categoryId)}」`));
  await refreshDocs();
  clearSelection();
  toast(`已把 ${docs.length} 份文件归入「${catPath(categoryId)}」`);
  render();
}
async function batchTag(ids, tagIds){
  if(!tagIds.length){ toast('没有选择标签', true); return; }
  const docs = state.docs.filter(d => ids.includes(d.id));
  for(const d of docs){
    const set = new Set(d.tags || []);
    tagIds.forEach(t => set.add(t));
    d.tags = Array.from(set);
    d.updatedAt = Date.now();
  }
  if(docs.length) await dbPutMany('docs', docs);
  docs.forEach(d => addAudit(d.id, 'tag', `批量添加标签：${tagIds.map(tagName).join('、') || '无'}`));
  await refreshDocs();
  clearSelection();
  toast(`已给 ${docs.length} 份文件更新标签`);
  render();
}
async function setDocTags(id, tagIds){
  const doc = state.docs.find(d => d.id === id);
  if(!doc) return;
  doc.tags = tagIds.slice();
  doc.updatedAt = Date.now();
  await dbPut('docs', doc);
  addAudit(doc.id, 'tag', tagIds.map(tagName).join('、') || '清空标签');
  await refreshDocs();
  toast('标签已保存');
  render();
}
async function saveExtracted(id){
  const doc = state.docs.find(d => d.id === id);
  if(!doc) return;
  const amountRaw = document.getElementById('ex-amount').value.trim();
  let amount_cents = null;
  if(amountRaw !== ''){
    const n = Number(amountRaw.replace(/[,，¥￥\s]/g, ''));
    if(!Number.isFinite(n) || n < 0 || n >= 1e12){ toast('金额格式不对', true); return; }
    amount_cents = Math.round(n * 100);
  }
  doc.extracted = {
    party: document.getElementById('ex-party').value.trim().slice(0, 120),
    amount_cents,
    doc_date: document.getElementById('ex-date').value,
    doc_no: document.getElementById('ex-no').value.trim().slice(0, 80),
    summary: document.getElementById('ex-summary').value.trim().slice(0, 300)
  };
  doc.updatedAt = Date.now();
  await dbPut('docs', doc);
  addAudit(doc.id, 'edit', '更新识别信息');
  await refreshDocs();
  toast('识别信息已保存');
  render();
}
async function saveDocName(id){
  const doc = state.docs.find(d => d.id === id);
  const input = document.getElementById('doc-name-input');
  if(!doc || !input) return;
  const raw = input.value.trim();
  if(!raw){ toast('文件名不能为空', true); return; }
  const old = doc.name;
  const oldExt = extOf(old);
  let next = sanitizeFileName(raw);
  const nextExt = extOf(next);
  if(oldExt && nextExt && nextExt.toLowerCase() !== oldExt.toLowerCase()){
    toast(`请保留原后缀 .${oldExt}，否则预览和下载会出错`, true);
    return;
  }
  if(oldExt && !nextExt) next += '.' + oldExt;
  if(next === doc.name){ toast('文件名没有变化'); return; }
  doc.name = next;
  doc.ext = oldExt || nextExt || doc.ext;
  doc.updatedAt = Date.now();
  await dbPut('docs', doc);
  addAudit(doc.id, 'rename', `「${old}」→「${next}」`);
  await refreshDocs();
  toast('文件名已更新');
  render();
}
async function downloadDoc(id){
  const doc = state.docs.find(d => d.id === id);
  if(!doc) return;
  const blob = await getBlob(doc.id);
  if(!blob){ toast('文件本体不在这台设备，可能是备份导入的记录', true); return; }
  downloadBlob(blob, doc.name);
  toast('已开始下载');
}
async function adoptAllSuggestions(){
  const docs = reviewDocs().filter(d => d.ai && d.ai.suggestedCategoryId && isLeaf(d.ai.suggestedCategoryId));
  if(!docs.length){ toast('没有可以直接采纳的建议'); return; }
  showConfirm('全部按建议归档', `将把 <strong>${docs.length}</strong> 份有建议的文件按规则归类。没有建议或置信度不足的会继续留在「待确认」。`, async () => {
    for(const d of docs){
      d.categoryId = d.ai.suggestedCategoryId;
      d.status = 'ready';
      d.updatedAt = Date.now();
    }
    await dbPutMany('docs', docs);
    docs.forEach(d => addAudit(d.id, 'review', `按建议归入「${catPath(d.categoryId)}」`));
    await refreshDocs();

async function emptyTrash(){

  showConfirm('清空回收站', `确定彻底删除回收站里的 <strong>${docs.length}</strong> 份文件？文件本体将一并移除，操作记录保留。`, async () => {

/* ---------- 分类管理 ---------- */
function categoryNameExists(name, parentId, exceptId){
  return state.categories.some(c => c.id !== exceptId && c.parentId === parentId && c.name === name);
}
async function addTopCategory(name){
  if(categoryNameExists(name, null)){ toast('这个一级分类已经存在', true); return; }
  const cat = { id:uid('cat'), parentId:null, name, icon:'folder', sort:topCats().length, color:'pine' };
  await dbPut('categories', cat);
  await addAudit(null, 'cat_admin', `新增一级分类「${name}」`);
  await reloadAll();
  toast(`已新增一级分类「${name}」`);
  render();
}
async function addChildCategory(parentId, name){
  const parent = catById(parentId);
  if(!parent){ toast('一级分类不存在', true); return; }
  if(categoryNameExists(name, parentId)){ toast('这个二级分类已经存在', true); return; }
  const cat = { id:uid('cat'), parentId, name, sort:childrenOf(parentId).length, icon:null };
  await dbPut('categories', cat);
  await addAudit(null, 'cat_admin', `新增二级分类「${parent.name} / ${name}」`);
  await reloadAll();
  toast(`已新增「${parent.name} / ${name}」`);
  render();
}
async function renameCategory(id, name){
  const cat = catById(id);
  if(!cat) return;
  if(categoryNameExists(name, cat.parentId, id)){ toast('同一层级下已有同名分类', true); return; }
  if(name === cat.name){ toast('名称没有变化'); return; }
  const oldName = cat.name;
  cat.name = name;
  await dbPut('categories', cat);
  await addAudit(null, 'cat_admin', `分类改名「${oldName}」→「${name}」`);
  await reloadAll();
  toast('分类已改名');
  render();
}
async function deleteCategory(id){
  const cat = catById(id);
  if(!cat) return;
  const kids = cat.parentId ? [] : childrenOf(id);
  const allIds = [id, ...kids.map(k => k.id)];
  const defaultId = state.settings.defaultCategoryId;
  if(allIds.includes(defaultId)){ toast('默认落点分类不能删除，请先到设置里换一个默认分类', true); return; }
  const affected = state.docs.filter(d => allIds.includes(d.categoryId));
  const text = cat.parentId
    ? `确定删除二级分类 <strong>${esc(cat.name)}</strong>？其中的 <strong>${affected.length}</strong> 份文件会移到「${esc(catPath(defaultId))}」。`
    : `确定删除一级分类 <strong>${esc(cat.name)}</strong> 及其 <strong>${kids.length}</strong> 个二级分类？其中的 <strong>${affected.length}</strong> 份文件会移到「${esc(catPath(defaultId))}」。`;
  showConfirm('删除分类', text, async () => {
    const auditWrites = [];
    for(const d of affected){
      d.categoryId = defaultId;
      d.updatedAt = Date.now();
      auditWrites.push(addAudit(d.id, 'move', `分类删除，自动移到「${catPath(defaultId)}」`));
    }
    await Promise.all(auditWrites);
    if(affected.length) await dbPutMany('docs', affected);
    for(const cid of allIds) await dbDelete('categories', cid);
    await addAudit(null, 'cat_admin', `删除分类「${cat.name}」，${affected.length} 份文件移到「${catPath(defaultId)}」`);
    await reloadAll();
    toast(`已删除分类，${affected.length} 份文件移到默认落点`);
    render();
  }, { danger:true, okText:'删除' });
}
async function moveCategory(id, dir){
  const cat = catById(id);
  if(!cat) return;
  const siblings = state.categories.filter(c => c.parentId === cat.parentId).sort((a,b) => (a.sort||0)-(b.sort||0));
  const idx = siblings.findIndex(c => c.id === id);
  const target = idx + dir;
  if(target < 0 || target >= siblings.length) return;
  const a = siblings[idx], b = siblings[target];
  const tmp = a.sort; a.sort = b.sort; b.sort = tmp;
  if(a.sort === b.sort){ siblings.forEach((c,i) => c.sort = i); await dbPutMany('categories', siblings); }
  else await dbPutMany('categories', [a, b]);
  await addAudit(null, 'cat_admin', `分类顺序调整：${cat.name}${dir < 0 ? '上移' : '下移'}`);
  await reloadAll();
  render();
}

/* ---------- 标签管理 ---------- */
async function saveTag(){
  const nameEl = document.getElementById('tag-name');
  const colorEl = document.getElementById('tag-color');
  const name = nameEl ? nameEl.value.trim() : '';
  const color = colorEl ? colorEl.value : '#C39B58';
  if(!name) { toast('标签名不能为空', true); return; }
  if(state.tags.some(t => t.id !== state.tagEditId && t.name === name)){ toast('已有同名标签', true); return; }
  if(state.tagEditId){
    const tag = tagById(state.tagEditId);
    if(!tag) return;
    if(tag.name === name && tag.color === color){ closeModal(); toast('标签没有变化'); return; }
    const oldName = tag.name;
    tag.name = name; tag.color = color;
    await dbPut('tags', tag);
    await addAudit(null, 'tag_admin', `标签编辑「${oldName}」→「${name}」`);
  }else{
    await dbPut('tags', { id:uid('tag'), name, color });
    await addAudit(null, 'tag_admin', `新建标签「${name}」`);
  }
  await reloadAll();
  closeModal();
  toast('标签已保存');
  render();
}
async function deleteTag(id){
  const tag = tagById(id);
  if(!tag) return;
  const used = state.docs.filter(d => (d.tags || []).includes(id)).length;
  showConfirm('删除标签', `确定删除标签 <strong>${esc(tag.name)}</strong>？它会从 ${used} 份文件上移除。`, async () => {
    const docs = state.docs.filter(d => (d.tags || []).includes(id));
    const auditWrites = [];
    docs.forEach(d => {
      d.tags = (d.tags || []).filter(t => t !== id);
      d.updatedAt = Date.now();
      auditWrites.push(addAudit(d.id, 'tag', `删除标签「${tag.name}」`));
    });
    await Promise.all(auditWrites);
    if(docs.length) await dbPutMany('docs', docs);
    await dbDelete('tags', id);
    await addAudit(null, 'tag_admin', `删除标签「${tag.name}」，影响 ${docs.length} 份文件`);
    await reloadAll();
    toast('标签已删除');
    render();
  }, { danger:true, okText:'删除' });
}

/* ---------- 设置 ---------- */
async function saveSettings(){
  const thresholdEl = document.getElementById('set-threshold');
  const defaultEl = document.getElementById('set-default-cat');
  const wmEl = document.getElementById('set-watermark');
  if(!thresholdEl || !defaultEl || !wmEl){ toast('设置项读取失败，请刷新后重试', true); return; }
  let threshold = Number(thresholdEl.value);
  if(!Number.isFinite(threshold)) threshold = 0.85;
  threshold = Math.max(0.5, Math.min(0.95, threshold));
  const defaultCategoryId = defaultEl.value;
  const watermark = !!wmEl.checked;
  if(!isLeaf(defaultCategoryId)){ toast('默认落点必须是二级分类', true); return; }
  if(state.settings.threshold === threshold && state.settings.defaultCategoryId === defaultCategoryId && !!state.settings.watermark === watermark){
    toast('设置没有变化');
    return;
  }
  state.settings.threshold = threshold;
  state.settings.defaultCategoryId = defaultCategoryId;
  state.settings.watermark = watermark;
  await dbPut('settings', Object.assign({}, state.settings, { id:'main' }));
  await addAudit(null, 'settings', `阈值 ${Math.round(threshold * 100)}%，默认落点「${catPath(defaultCategoryId)}」，水印${watermark ? '开' : '关'}`);
  toast('设置已保存');
  render();
}
async function clearAllData(){
  if(state.uploadRunning){ toast('正在处理上传，等这批完成后再清空', true); return; }
  showConfirm('清空全部数据', '<strong>这会删除本浏览器里的全部档案、文件本体、分类、标签和操作记录。</strong>这个动作无法撤销。建议先导出 JSON 备份。确定继续？', async () => {
    await clearAllStores();
    await ensureSeed();
    await reloadAll();
    clearSelection();
    state.uploadQueue = [];
    state.lastUploadSummary = null;
    toast('已清空并恢复默认分类');
    navigate('home');
  }, { danger:true, okText:'全部清空' });
}

/* ============================================================
   事件
   ============================================================ */
async function handleAction(action, el){
  const id = el.dataset.id;
  switch(action){
    case 'open-upload': openUploadModal(); break;
    case 'pick-files': document.getElementById('hidden-file-input').click(); break;
    case 'close-modal': closeModal(); break;
    case 'modal-backdrop': break;
    case 'open-settings': navigate('settings'); break;
    case 'nav-list': navigate('list'); break;
    case 'open-cat':
      state.query = '';
      navigate('list', { filters:{ category:id, status:'', tag:'', type:'', year:'' }, reset:true });
      break;
    case 'open-doc': openDoc(id); break;
    case 'toggle-select': {
      if(state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
      render();
      break;
    }
    case 'clear-filters':
      resetFilters();
      render();
      break;
    case 'export-list': exportCSV(listRows(), currentListLabel()); break;
    case 'prev-page': if(state.page > 1){ state.page -= 1; render(); } break;
    case 'next-page': state.page += 1; render(); break;
    case 'change-cat': openCatModal({ mode:'single', docId:id }); break;
    case 'confirm-suggestion': await adoptSuggestion(id); render(); break;
    case 'review-later': toast('已留在待确认，稍后再处理'); break;
    case 'review-all-suggest': await adoptAllSuggestions(); break;
    case 'restore-doc': await restoreDoc(id); break;
    case 'purge-doc': await purgeDoc(id); break;
    case 'delete-doc': await softDeleteDoc(id); break;
    case 'batch-move': {
      const ids = Array.from(state.selected);
      if(ids.length) openCatModal({ mode:'batch', ids });
      break;
    }
    case 'batch-tag': {
      const ids = Array.from(state.selected);
      if(ids.length) openTagModal({ mode:'batch', ids });
      break;
    }
    case 'batch-delete': {
      const ids = Array.from(state.selected);
      if(!ids.length) break;
      showConfirm('移入回收站', `确定把选中的 <strong>${ids.length}</strong> 份文件移入回收站？可以随时恢复。`, async () => {
        const docs = state.docs.filter(d => ids.includes(d.id));
        const now = Date.now();
        docs.forEach(d => { d.deletedAt = now; d.updatedAt = now; });
        await dbPutMany('docs', docs);
        docs.forEach(d => addAudit(d.id, 'delete', '批量移入回收站'));
        clearSelection();
        await refreshDocs();
        toast(`已移入回收站 ${docs.length} 份`);
        render();
      }, { danger:true, okText:'移入回收站' });
      break;
    }
    case 'batch-clear': clearSelection(); render(); break;
    case 'cat-pick-l1':
      state.catModal.l1 = id;
      state.catModal.l2 = null;
      renderCatModal();
      break;
    case 'cat-pick-l2':
      state.catModal.l2 = id;
      renderCatModal();
      break;
    case 'confirm-cat-move': {
      const target = state.catModal.l2;
      if(!target){ toast('还没有选择二级分类', true); break; }
      const cm = state.catModal;
      closeModal();
      if(cm.mode === 'batch') await batchMove(cm.ids, target);
      else await moveDocTo(cm.docId, target);
      render();
      break;
    }
    case 'edit-tags': openTagModal({ mode:'single', docId:id }); break;
    case 'toggle-tag-draft': {
      const d = state.tagModal.draft;
      if(d.includes(id)) state.tagModal.draft = d.filter(x => x !== id);
      else state.tagModal.draft = d.concat(id);
      renderTagModal();
      break;
    }
    case 'confirm-tags': {
      const tags = state.tagModal.draft.slice();
      const tm = state.tagModal;
      closeModal();
      if(tm.mode === 'batch') await batchTag(tm.ids, tags);
      else await setDocTags(tm.ids[0], tags);
      render();
      break;
    }
    case 'save-extracted': await saveExtracted(id); break;
    case 'save-name': await saveDocName(id); break;
    case 'download-doc': await downloadDoc(id); break;
    case 'copy-sha': {
      const doc = state.docs.find(d => d.id === id);
      if(!doc) break;
      if(!doc.sha256){ toast('这份记录没有 SHA 指纹', true); break; }
      try{
        await navigator.clipboard.writeText(doc.sha256 || '');
        toast('指纹已复制');
      }catch(e){
        const ta = document.createElement('textarea');
        ta.value = doc.sha256 || ''; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); toast('指纹已复制'); }catch(err){ toast('复制失败，请手动选择', true); }
        ta.remove();
      }
      break;
    }
    case 'save-settings': await saveSettings(); break;
    case 'export-backup': exportBackup(); break;
    case 'export-csv-all': exportCSV(liveDocs(), '全部在库'); break;
    case 'export-trash': exportCSV(deletedDocs(), '回收站'); break;
    case 'import-backup': document.getElementById('hidden-backup-input').click(); break;
    case 'clear-all-data': await clearAllData(); break;
    case 'empty-trash': await emptyTrash(); break;
    case 'add-top-cat':
      showPrompt('新增一级分类', '分类名称', '', '例如：车辆', async name => {
        await addTopCategory(name);
      }, { sub:'一级分类只做门类，具体落点放在二级。' });
      break;
    case 'add-child-cat': {
      const parent = catById(id);
      if(!parent) break;
      showPrompt(`给「${parent.name}」新增二级分类`, '分类名称', '', '例如：行驶证', async name => {
        await addChildCategory(parent.id, name);
      }, { sub:'二级分类才是文件真正的归档位置。' });
      break;
    }
    case 'rename-cat': {
      const cat = catById(id);
      if(!cat) break;
      showPrompt(cat.parentId ? '二级分类改名' : '一级分类改名', '分类名称', cat.name, '', async name => {
        await renameCategory(cat.id, name);
      });
      break;
    }
    case 'delete-cat': await deleteCategory(id); break;
    case 'move-cat': await moveCategory(id, Number(el.dataset.dir)); break;
    case 'add-tag': openTagEditor(null); break;
    case 'edit-tag': openTagEditor(id); break;
    case 'delete-tag': await deleteTag(id); break;
    case 'tag-edit-confirm': await saveTag(); break;
    case 'prompt-confirm': {
      const input = document.getElementById('prompt-input');
      const value = input ? input.value.trim() : '';
      if(!value){ toast('不能为空', true); break; }
      const cb = state.promptCallback;
      closeModal();
      if(cb) await cb(value);
      break;
    }
    case 'confirm-ok': {
      const cb = state.confirmCallback;
      closeModal();
      if(cb) await cb();
      break;
    }
    case 'confirm-cancel': closeModal(); break;
    default: break;
  }
}

document.addEventListener('click', async e => {
  const navList = e.target.closest('[data-nav-list]');
  if(navList){ e.preventDefault(); resetFilters(); navigate('list'); return; }
  const routeBtn = e.target.closest('[data-route-btn]');
  if(routeBtn){ e.preventDefault(); navigate(routeBtn.dataset.routeBtn); return; }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action === 'modal-backdrop'){
    if(e.target === el) closeModal();
    return;
  }
  if(el.tagName === 'BUTTON' || el.tagName === 'A' || el.dataset.action !== 'open-doc') e.preventDefault();
  try{ await handleAction(action, el); }catch(err){
    console.error(err);
    toast(err.message || '操作失败', true);
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(document.getElementById('modal-root').innerHTML) closeModal();
    return;
  }
  if((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('folder')){
    e.preventDefault();
    const id = e.target.dataset.id;
    if(id){ state.query = ''; navigate('list', { filters:{ category:id, status:'', tag:'', type:'', year:'' }, reset:true }); }
  }
  if((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('doc-row')){
    e.preventDefault();
    const id = e.target.dataset.id;
    if(id) openDoc(id);
  }
  if(e.key === 'Enter' && e.target && e.target.id === 'prompt-input'){
    e.preventDefault();
    const btn = document.querySelector('[data-action="prompt-confirm"]');
    if(btn) btn.click();
  }
});

document.addEventListener('change', e => {
  const filter = e.target.dataset ? e.target.dataset.filter : null;
  if(filter){
    state.filters[filter] = e.target.value;
    state.page = 1;
    clearSelection();
    render();
    return;
  }
  if(e.target.dataset && e.target.dataset.sort){
    state.sort = e.target.value;
    state.page = 1;
    render();
    return;
  }
  if(e.target.id === 'hidden-file-input'){
    addFiles(e.target.files);
    e.target.value = '';
  }
  if(e.target.id === 'hidden-backup-input'){
    if(e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = '';
  }
  if(e.target.id === 'set-threshold'){
    const el = document.querySelector('[data-threshold-val]');
    if(el) el.textContent = Math.round(Number(e.target.value) * 100) + '%';
  }
  if(e.target.id === 'set-watermark' || e.target.id === 'set-default-cat'){
    // 保存由按钮触发，避免改一下设置就写库
  }
});

/* 搜索 */
function initSearch(){
  const el = document.getElementById('global-search');
  if(!el) return;
  el.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      e.preventDefault();
      const query = el.value.trim();
      if(state.view !== 'list') resetFilters();
      state.query = query;
      state.page = 1;
      clearSelection();
      if(state.view !== 'list'){
        releasePreview();
        navigate('list');
      }else render();
    }
  });
  el.addEventListener('search', () => {
    if(!el.value){ state.query = ''; state.page = 1; render(); }
  });
}
function syncSearchValue(){
  const el = document.getElementById('global-search');
  if(el && document.activeElement !== el) el.value = state.query;
}

/* 拖拽 */
function initDrop(){
  const zoneFor = target => {
    if(!target || !target.closest) return null;
    const direct = target.closest('.drop-zone');
    if(direct) return direct;
    const modal = target.closest('.modal');
    return modal ? modal.querySelector('.drop-zone') : null;
  };
  window.addEventListener('dragover', e => {
    if(zoneFor(e.target)) e.preventDefault();
  });
  window.addEventListener('dragenter', e => {
    const z = zoneFor(e.target);
    if(z){ e.preventDefault(); z.classList.add('over'); }
  });
  window.addEventListener('dragleave', e => {
    const z = zoneFor(e.target);
    if(z && !z.contains(e.relatedTarget)) z.classList.remove('over');
  });
  window.addEventListener('drop', e => {
    const z = zoneFor(e.target);
    if(!z) return;
    e.preventDefault(); z.classList.remove('over');
    if(e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });
}

/* ============================================================
   启动
   ============================================================ */
async function boot(){
  try{
    db = await openDB();
    await ensureSeed();
    await reloadAll();
    await normalizeSettings();
    state.ready = true;
    initSearch();
    initDrop();
    applyHash();
    syncSearchValue();
  }catch(err){
    console.error(err);
    const app = document.getElementById('app');
    app.innerHTML = `<div class="empty" style="margin-top:80px">
      <div class="art"><div class="tab"></div><div class="back"></div><div class="front"></div></div>
      <div class="t">柜子打不开</div>
      <div class="s">${esc(err && err.message ? err.message : '浏览器不支持本地数据库，或隐私模式限制了存储。')}<br>可以换一个普通窗口、关闭无痕模式后重试。</div>
    </div>`;
  }
}
window.addEventListener('hashchange', () => { if(state.ready) applyHash(); });
boot();
</script>
